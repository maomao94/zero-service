# =============================================================
# workflow 名称（在 GitHub Actions 页面显示的标题）
# =============================================================
name: Go

# =============================================================
# 触发条件（on）——什么时候运行这个 workflow
#  - push:        代码被推送到 master 时触发
#  - pull_request:有人向 master 提 PR 时触发
# 这两个都指向 master，表示只有涉及 master 的变更才跑 CI
# =============================================================
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# =============================================================
# jobs：定义要执行的任务（可多个，这里只一个 test-linux）
# =============================================================
jobs:
  # 任务标识名，可任意，这里叫 test-linux
  test-linux:
    name: Linux          # 在界面显示的任务名
    runs-on: ubuntu-latest  # 运行环境：GitHub 提供的 Linux 虚拟机

    # steps：按顺序执行的一个个步骤
    steps:
      # 第 1 步：把仓库代码下载到虚拟机
      - name: Check out code
        uses: actions/checkout@v4   # 官方 checkout 动作

      # 第 2 步：安装 Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  # 自动读取 go.mod 里的 go 版本，保持本地和 CI 一致
          check-latest: true       # 有更新的补丁版本就用最新的
          cache: true              # 缓存 Go 模块，加快下次运行

      # 第 3 步：装系统依赖
      # 本项目用了几个 C 库，这里逐一说明哪些必须装、哪些不用：
      #   - GEOS（common/gisx/geos → go-geos）：必须装 libgeos-dev，
      #     编译时要 pkg-config 能找到 geos.pc，否则报 Package geos was not found
      #   - H3（uber/h3-go/v4）：C 源码随包附带（h3_*.c），无需系统库
      #   - SQLite（mattn/go-sqlite3）：自带 amalgamation，无需系统库
      #   - FFmpeg（u2takey/ffmpeg-go）：只是调 ffmpeg 命令行，编译期不需要，
      #     只有跑到视频转码时才依赖可执行文件，CI 不装也不影响 vet/test
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      # 第 4 步：下载依赖
      - name: Get dependencies
        run: |
          go get -v -t -d ./...    # 拉取 go.mod 声明的所有依赖

      # 第 5 步：静态检查（go vet 是 Go 自带的代码质量检查）
      - name: Vet
        run: go vet ./...

      # 第 6 步：跑全部单元测试，带 -race 开启数据竞争检测
      - name: Test
        run: go test -race ./...