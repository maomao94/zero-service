# =============================================================
# 文档质量门禁
#  - 校验 Markdown 的相对链接、页内锚点与代码块闭合
#  - 与本地命令一致：python3 scripts/check_docs.py
#  - 只在文档或脚本变更时触发，避免占用无关构建资源
# =============================================================
name: Docs

on:
  push:
    branches: [ master, develop ]
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [ master, develop ]
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # ubuntu-latest 自带 python3，脚本只依赖标准库，无需额外安装
      - name: Check docs
        run: python3 scripts/check_docs.py
