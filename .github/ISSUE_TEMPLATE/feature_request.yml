name: 功能请求
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前建议先看 [架构概览](https://github.com/maomao94/zero-service/blob/develop/docs/architecture.md)，确认是否已有相关能力。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你遇到什么场景？为什么现有能力不够用？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 希望新增或修改什么？如涉及接口，请给出方法名、入参和出参草案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么不采用。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 变更范围
      description: 预计影响哪些模块？
      options:
        - 新增服务
        - 现有服务新增接口
        - 协议与数据契约（.proto / .api）
        - 部署与运维
        - 前端
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、上游规范、兼容性要求等。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认没有重复
          required: true
