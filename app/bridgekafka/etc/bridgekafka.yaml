Name: bridgekafka.rpc
ListenOn: 0.0.0.0:21013
Timeout: 10000
Mode: dev
Log:
  Encoding: plain
  #  Mode: file
  Path: /opt/logs/bridgekafka
  Level: info
  KeepDays: 300
NacosConfig:
  IsRegister: false
  Host: 127.0.0.1
  Port: 8848
  Username: nacos
  PassWord: nacos
  NamespaceId: public
  ServiceName: bridge-kafka
KafkaPushConfig:
  Brokers:
    - 127.0.0.1:9094
  Topics:
    - asdu
    - alarm
    - event
  # 发布端固定按 key 哈希分区：同 key 落同一分区、组内有序；
  # 不带 key 时由 go-queue 注入纳秒时间戳 key，均匀分散、不保证顺序
  # 注意 key 必须是业务实体标识（点位/设备/任务），不要用常量 key，否则会压到单一分区
KafkaConsumeConfig:
  - Brokers:
      - 127.0.0.1:9094
    Topic: asdu
    Group: bridge-kafka-asdu
    Conns: 3
    Consumers: 3
    Processors: 18
    MinBytes: 1048576
    MaxBytes: 10485760
StreamEventConf:
  Endpoints:
    - 127.0.0.1:21009
  NonBlock: true
  Timeout: 10000
