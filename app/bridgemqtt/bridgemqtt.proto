syntax = "proto3";

package bridgemqtt;
option go_package = "./bridgemqtt";
option java_multiple_files = true;
option java_package = "com.github.bridgemqtt.grpc";
option java_outer_classname = "BridgeMqttProto";

// Bridge MQTT 服务
service BridgeMqtt {
  // 发布消息。请求上下文携带 span 时由 mqttx 自动注入 trace 头，无需单独的带 trace 接口。
  rpc Publish(PublishReq) returns (PublishRes);
}

// -------------------- 通用请求/响应 --------------------
message PublishReq {
  string topic = 1 [json_name = "topic"];
  bytes payload = 2 [json_name = "payload"];
}

message PublishRes {
}
