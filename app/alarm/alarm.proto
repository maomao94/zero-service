syntax = "proto3";
package alarm;

option go_package = "./alarm";

message Req {
  string ping = 1 [json_name = "ping"];
}

message Res {
  string pong = 1 [json_name = "pong"];
}

message AlarmReq {
  string chat_name = 1 [json_name = "chatName"]; // 服务告警 P0:线上事故处理 P1:线上事故处理 P2:线上事故处理 P3:线上事故处理 其他会新建群
  string description = 2 [json_name = "description"]; // 报警描述
  string title = 3 [json_name = "title"]; // 报警标题
  string project = 4 [json_name = "project"]; // 项目名称
  string date_time = 5 [json_name = "dateTime"]; // 2019-01-01 00:00:00
  string alarm_id = 6 [json_name = "alarmId"]; // 唯一报警 id
  string content = 7 [json_name = "content"]; // 报警内容
  string error = 8 [json_name = "error"]; // 错误信息
  repeated string user_id = 9 [json_name = "userId"]; // 报警人 userId
  string ip = 10 [json_name = "ip"]; // 报警 ip
}

message AlarmRes {
}

service Alarm {
  rpc Ping(Req) returns(Res);
  rpc Alarm(AlarmReq) returns(AlarmRes); // 报警
}
