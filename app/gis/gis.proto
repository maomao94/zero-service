syntax = "proto3";

package gis;
option go_package = "./gis";
option java_multiple_files = true;
option java_package = "com.github.gis.grpc";
option java_outer_classname = "GisProto";

// 坐标系类型枚举（覆盖国内主流场景，后续可扩展）
enum CoordType {
  COORD_TYPE_UNSPECIFIED = 0; // 未指定（默认无效值，用于校验）
  COORD_TYPE_WGS84 = 1;       // WGS84：GPS原生坐标（国际通用）
  COORD_TYPE_GCJ02 = 2;       // GCJ02：高德/腾讯/谷歌中国坐标（火星加密）
  COORD_TYPE_BD09 = 3;        // BD09：百度坐标（在GCJ02基础上二次加密）
}

// GIS 相关服务
service Gis {
  // 编码 geohash
  rpc EncodeGeoHash (EncodeGeoHashReq) returns (EncodeGeoHashRes);
  // 多精度编码 geohash
  rpc EncodeGeoHashMulti (EncodeGeoHashMultiReq) returns (EncodeGeoHashMultiRes);
  // 解码 geohash -> 经纬度 + 格网边界
  rpc DecodeGeoHash (DecodeGeoHashReq) returns (DecodeGeoHashRes);

  // 编码 H3
  rpc EncodeH3 (EncodeH3Req) returns (EncodeH3Res);
  // 多分辨率编码 H3
  rpc EncodeH3Multi (EncodeH3MultiReq) returns (EncodeH3MultiRes);
  // 解码 H3 index -> 中心点 + 边界多边形
  rpc DecodeH3 (DecodeH3Req) returns (DecodeH3Res);

  // H3 gridDisk：按 H3 origin 获取周围 k 圈内的 cells
  rpc GridDisk (GridDiskReq) returns (GridDiskRes);
  // H3 gridDisk：按坐标编码 origin 后获取周围 k 圈内的 cells
  rpc GridDiskByPoint (GridDiskByPointReq) returns (GridDiskRes);

  // 计算多边形围栏覆盖的 geohash cells（纯计算，不持久化）
  rpc GenerateFenceCells (GenFenceCellsReq) returns (GenFenceCellsRes);
  // 计算多边形围栏覆盖的 H3 cells（纯计算，不持久化）
  rpc GenerateFenceH3Cells (GenFenceH3CellsReq) returns (GenFenceH3CellsRes);

  // 获取半径内的点
  rpc PointsWithinRadius (PointsWithinRadiusReq) returns (PointsWithinRadiusRes);
  // 点是否命中电子围栏（单个）。支持两种模式：上送 polygon 主动判断，或上送 fence_id 从 store 查询判断。
  rpc PointInFence (PointInFenceReq) returns (PointInFenceRes);
  // 点是否命中电子围栏（多个围栏）。支持两种模式：上送 polygon 主动判断，或上送 fence_id 从 store 查询判断。
  rpc PointInFences (PointInFencesReq) returns (PointInFencesRes);

  // 计算两个点之间的距离（米）
  rpc Distance (DistanceReq) returns (DistanceRes);
  // 批量计算两点之间的距离（米）
  rpc BatchDistance (BatchDistanceReq) returns (BatchDistanceRes);

  // 获取某点附近多少 km 的围栏（粗过滤）
  rpc NearbyFences (NearbyFencesReq) returns (NearbyFencesRes);

  // 单个坐标转换
  rpc TransformCoord (TransformCoordReq) returns (TransformCoordRes);
  // 批量坐标转换
  rpc BatchTransformCoord (BatchTransformCoordReq) returns (BatchTransformCoordRes);

  // 计算点集合的近似最优访问路径（开放式 TSP）
  rpc RoutePoints (RoutePointsReq) returns (RoutePointsRes);

  // 新增电子围栏（计算 H3/geohash cells 并持久化）
  rpc CreateFence (CreateFenceReq) returns (CreateFenceRes);
  // 更新电子围栏（重新计算 cells）
  rpc UpdateFence (UpdateFenceReq) returns (UpdateFenceRes);
  // 删除电子围栏
  rpc DeleteFence (DeleteFenceReq) returns (DeleteFenceRes);
  // 围栏列表（分页）
  rpc ListFences (ListFencesReq) returns (ListFencesRes);
  // 围栏详情
  rpc GetFence (GetFenceReq) returns (GetFenceRes);
}

// ────────────────────── 基础几何类型 ──────────────────────

message Point {
  double lon = 1 [json_name = "lon"]; // 经度（-180 到 180）
  double lat = 2 [json_name = "lat"]; // 纬度（-90 到 90）
}

message PointPair {
  Point a = 1 [json_name = "a"];
  Point b = 2 [json_name = "b"];
}

message Ring {
  repeated Point points = 1 [json_name = "points"];    // 环顶点（至少 3 个点，自动首尾闭合）
}

message Polygon {
  Ring outer = 1 [json_name = "outer"];               // 外环，定义围栏边界
  repeated Ring holes = 2 [json_name = "holes"];      // 洞/内环，命中判断和 cells 覆盖时从外环中排除。洞必须完全在外环内部，超出或洞相交会被拒绝。
}

message Fence {
  string fence_id = 1 [json_name = "fenceId"];          // 围栏 ID（从 store 查询判断时必填）
  Polygon polygon = 2 [json_name = "polygon"];          // 围栏多边形（主动判断时必填；outer 为外环，holes 为排除区域）
}

// ────────────────────── Geohash 编码/解码 ──────────────────────

message EncodeGeoHashReq {
  Point point = 1 [json_name = "point"];             // 待编码的经纬度点
  uint32 precision = 2 [json_name = "precision"];        // geohash 精度 1-12；proto 侧无默认值，由 logic 层默认 7
}

message EncodeGeoHashRes {
  string geohash = 1 [json_name = "geohash"];          // geohash 编码字符串（长度等于 precision）
}

message GeoHashIndex {
  uint32 precision = 1 [json_name = "precision"];        // geohash 编码精度
  string geohash = 2 [json_name = "geohash"];          // geohash 编码字符串
}

message EncodeGeoHashMultiReq {
  Point point = 1 [json_name = "point"];                // 待编码的经纬度点
  repeated uint32 precisions = 2 [json_name = "precisions"]; // geohash 精度列表（取值 1-12），必填，返回顺序与输入一致
}

message EncodeGeoHashMultiRes {
  repeated GeoHashIndex geohashes = 1 [json_name = "geohashes"]; // 多精度编码结果列表，按请求 precisions 顺序对齐
}

message DecodeGeoHashReq {
  string geohash = 1 [json_name = "geohash"];          // geohash 编码字符串
}

message DecodeGeoHashRes {
  Point point = 1 [json_name = "point"];             // 中心点（格网中心经纬度）
  uint32 precision = 2 [json_name = "precision"];        // geohash 编码精度（对应输入 geohash 长度），取值 1-12
  double lon_min = 3 [json_name = "lonMin"];          // 格子经度下界
  double lon_max = 4 [json_name = "lonMax"];          // 格子经度上界
  double lat_min = 5 [json_name = "latMin"];          // 格子纬度下界
  double lat_max = 6 [json_name = "latMax"];          // 格子纬度上界
}

// ────────────────────── H3 编码/解码 ──────────────────────

message EncodeH3Req {
  Point point = 1 [json_name = "point"];             // 待编码的经纬度点
  uint32 resolution = 2 [json_name = "resolution"];       // H3 分辨率 0-15；proto 侧无默认值，由 logic 层默认 9
}

message EncodeH3Res {
  string h3_index = 1 [json_name = "h3Index"];         // H3 index（十六进制字符串）
}

message H3Index {
  uint32 resolution = 1 [json_name = "resolution"];       // H3 分辨率
  string h3_index = 2 [json_name = "h3Index"];         // H3 index（十六进制字符串）
}

message EncodeH3MultiReq {
  Point point = 1 [json_name = "point"];                // 待编码的经纬度点
  repeated uint32 resolutions = 2 [json_name = "resolutions"]; // H3 分辨率列表（取值 0-15），必填，返回顺序与输入一致
}

message EncodeH3MultiRes {
  repeated H3Index h3_indexes = 1 [json_name = "h3Indexes"]; // 多分辨率编码结果列表，按请求 resolutions 顺序对齐
}

message DecodeH3Req {
  string h3_index = 1 [json_name = "h3Index"];         // H3 index（十六进制字符串）
}

message DecodeH3Res {
  Point center = 1 [json_name = "center"];            // H3 格子中心点经纬度
  repeated Point boundary = 2 [json_name = "boundary"]; // H3 格子边界顶点（六边形，6 个点，按顺序闭合）
  uint32 resolution = 3 [json_name = "resolution"];       // H3 分辨率 0-15（对应输入 H3 index 的分辨率）
}

// ────────────────────── GridDisk（H3 邻域查询）──────────────────────

message GridDiskReq {
  string h3_index = 1 [json_name = "h3Index"];         // H3 origin index
  uint32 k = 2 [json_name = "k"];                // 周围圈数，0 表示只返回 origin，1 表示返回 origin + 第一圈，依此类推
}

message GridDiskByPointReq {
  Point point = 1 [json_name = "point"];             // 经纬度点（将编码为 H3 origin）
  uint32 resolution = 2 [json_name = "resolution"];       // H3 分辨率 0-15，默认 9
  uint32 k = 3 [json_name = "k"];                // 周围圈数，0 表示只返回 origin，1 表示返回 origin + 第一圈，依此类推
}

message GridDiskCell {
  string h3_index = 1 [json_name = "h3Index"];         // H3 index
  uint32 ring = 2 [json_name = "ring"];             // 所在圈数：0=origin，1=第一圈，依此类推；不是米级距离
}

message GridDiskRes {
  string origin = 1 [json_name = "origin"];               // H3 origin index（请求的 h3_index 或由 point 编码所得）
  repeated GridDiskCell cells = 2 [json_name = "cells"]; // 周围 cells 列表，按 ring 递增顺序排列
}

// ────────────────────── 围栏格子计算（纯计算）──────────────────────

message GenFenceCellsReq {
  Polygon polygon = 1 [json_name = "polygon"];            // 围栏多边形；outer 为外环，holes 为排除区域
  uint32 precision = 2 [json_name = "precision"];           // geohash 精度 1-12，默认 7
  bool include_neighbors = 3 [json_name = "includeNeighbors"];     // 是否扩展周边 8 邻居格子
}

message GenFenceCellsRes {
  repeated string geohashes = 1 [json_name = "geohashes"];  // 围栏覆盖的 geohash cells
}

message GenFenceH3CellsReq {
  Polygon polygon = 1 [json_name = "polygon"];            // 围栏多边形；outer 为外环，holes 为排除区域
  uint32 resolution = 2 [json_name = "resolution"];          // H3 分辨率 0-15，默认 9
}

message GenFenceH3CellsRes {
  repeated string h3_indexes = 1 [json_name = "h3Indexes"]; // 围栏覆盖的 H3 cells
}

// ────────────────────── 半径命中 ──────────────────────

message PointsWithinRadiusReq {
  Point center = 1 [json_name = "center"];               // 中心点
  repeated Point points = 2 [json_name = "points"];      // 待检查的点集合
  double radius_meters = 3 [json_name = "radiusMeters"];       // 半径（米）
}

message RadiusHit {
  int32 index = 1 [json_name = "index"];                // 命中点在输入 points 中的下标
  double distance_meters = 2 [json_name = "distanceMeters"];     // 命中点到中心点的球面距离（米）
}

message PointsWithinRadiusRes {
  repeated RadiusHit hits = 1 [json_name = "hits"];    // 半径内的命中结果列表，不返回点坐标以减小响应体
}

// ────────────────────── 围栏命中判断 ──────────────────────

message PointInFenceReq {
  Point point = 1 [json_name = "point"];               // 待检查的点
  Fence fence = 2 [json_name = "fence"];               // 围栏多边形
}

message PointInFenceRes {
  bool hit = 1 [json_name = "hit"];                  // true：点在围栏内；false：点在围栏外
}

message PointInFencesReq {
  Point point = 1 [json_name = "point"];               // 待检查的点
  repeated Fence fences = 2 [json_name = "fences"];     // 多个待判断的围栏
}

message PointInFencesRes {
  repeated string hit_fence_ids = 1 [json_name = "hitFenceIds"]; // 命中的围栏 ID 列表（点在其中至少一个围栏内）
}

// ────────────────────── 距离计算 ──────────────────────

message DistanceReq {
  Point a = 1 [json_name = "a"];                   // 点 A
  Point b = 2 [json_name = "b"];                   // 点 B
}

message DistanceRes {
  double meters = 1 [json_name = "meters"];             // A、B 两点的球面距离（米）
}

message BatchDistanceReq {
  repeated PointPair pairs = 1 [json_name = "pairs"];  // 待计算的点对列表
}

message BatchDistanceRes {
  repeated double meters = 1 [json_name = "meters"];    // 每对点的球面距离（米），顺序与 pairs 对齐
}

// ────────────────────── 附近围栏 ──────────────────────

message NearbyFencesReq {
  Point point = 1 [json_name = "point"];               // 参考点
  double km = 2 [json_name = "km"];                 // 搜索半径（公里），将自动选择合适的 geohash/H3 精度进行粗过滤
}

message NearbyFencesRes {
  repeated string fence_ids = 1 [json_name = "fenceIds"]; // 附近围栏 ID 列表（粗过滤结果，非精确距离判断）
}

// ────────────────────── 坐标转换 ──────────────────────

message TransformCoordReq {
  Point point = 1 [json_name = "point"];
  CoordType source_type = 2 [json_name = "sourceType"];     // 源坐标系
  CoordType target_type = 3 [json_name = "targetType"];     // 目标坐标系
}

message TransformCoordRes {
  Point transformed_point = 1 [json_name = "transformedPoint"];   // 转换后的坐标点
}

message BatchTransformCoordReq {
  repeated Point points = 1 [json_name = "points"];
  CoordType source_type = 2 [json_name = "sourceType"];     // 源坐标系
  CoordType target_type = 3 [json_name = "targetType"];     // 目标坐标系
}

message BatchTransformCoordRes {
  repeated Point transformed_points = 1 [json_name = "transformedPoints"]; // 转换后的坐标点列表，顺序与请求对齐
}

// ────────────────────── 路径优化 ──────────────────────

message RoutePointsReq {
  Point start = 1 [json_name = "start"];               // 起点
  repeated Point points = 2 [json_name = "points"];     // 待排序途经点（不含起点）
}

message RoutePointsRes {
  repeated int32 visit_order = 1 [json_name = "visitOrder"];    // 途经点访问顺序（按 points 在请求中的下标排列）
  double total_distance_meters = 2 [json_name = "totalDistanceMeters"];  // 从起点按 visit_order 访问所有途经点的总距离（米）
}

// ────────────────────── 围栏 CRUD ──────────────────────

message CreateFenceReq {
  string name = 1 [json_name = "name"];               // 围栏名称
  Polygon polygon = 2 [json_name = "polygon"];           // 围栏多边形；outer 为外环，holes 为排除区域
  uint32 h3_resolution = 3 [json_name = "h3Resolution"];      // H3 分辨率 0-15，默认 9
  uint32 geohash_precision = 4 [json_name = "geohashPrecision"];  // geohash 精度 1-12，默认 7
}

message CreateFenceRes {
  string fence_id = 1 [json_name = "fenceId"];           // 新创建围栏的 ID
  repeated string h3_cells = 2 [json_name = "h3Cells"];  // 围栏覆盖的 H3 cells
  repeated string geohashes = 3 [json_name = "geohashes"]; // 围栏覆盖的 geohash cells
}

message UpdateFenceReq {
  string fence_id = 1 [json_name = "fenceId"];           // 待更新围栏 ID
  string name = 2 [json_name = "name"];               // 新名称（空字符串表示不更新）
  Polygon polygon = 3 [json_name = "polygon"];           // 新围栏多边形；outer 为外环，holes 为排除区域
  uint32 h3_resolution = 4 [json_name = "h3Resolution"];      // H3 分辨率 0-15，默认 9
  uint32 geohash_precision = 5 [json_name = "geohashPrecision"];  // geohash 精度 1-12，默认 7
}

message UpdateFenceRes {
  repeated string h3_cells = 1 [json_name = "h3Cells"];  // 更新后的围栏覆盖 H3 cells
  repeated string geohashes = 2 [json_name = "geohashes"]; // 更新后的围栏覆盖 geohash cells
}

message DeleteFenceReq {
  string fence_id = 1 [json_name = "fenceId"];
}

message DeleteFenceRes {}

message ListFencesReq {
  int64 page = 1 [json_name = "page"];                // 页码，从 1 开始
  int64 page_size = 2 [json_name = "pageSize"];           // 每页条数，默认 20，最大 200
  string name = 3 [json_name = "name"];               // 可选：按名称模糊搜索
}

message ListFencesRes {
  repeated FenceDetail list = 1 [json_name = "list"]; // 围栏列表
  int64 total = 2 [json_name = "total"];               // 总条数
}

message GetFenceReq {
  string fence_id = 1 [json_name = "fenceId"];
}

message GetFenceRes {
  FenceDetail fence = 1 [json_name = "fence"];
}

message FenceDetail {
  string fence_id = 1 [json_name = "fenceId"];          // 围栏 ID
  string name = 2 [json_name = "name"];              // 围栏名称
  Polygon polygon = 3 [json_name = "polygon"];          // 围栏多边形；outer 为外环，holes 为排除区域
  uint32 h3_resolution = 4 [json_name = "h3Resolution"];     // H3 分辨率
  uint32 geohash_precision = 5 [json_name = "geohashPrecision"]; // geohash 精度
  repeated string h3_cells = 6 [json_name = "h3Cells"]; // 围栏覆盖的 H3 cells
  repeated string geohashes = 7 [json_name = "geohashes"]; // 围栏覆盖的 geohash cells
  int64 created_at = 8 [json_name = "createdAt"];          // 创建时间（毫秒时间戳）
  int64 updated_at = 9 [json_name = "updatedAt"];          // 更新时间（毫秒时间戳）
}
