<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live 会面</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.1/dist/livekit-client.umd.min.js"></script>
<style>
:root{--ink:#17202a;--muted:#66727d;--line:#dce3e8;--paper:#f6f8f9;--white:#fff;--teal:#087f80;--teal-dark:#075d63;--red:#c93d4b;--amber:#a06412;}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:#e8f0ef}.auth-card{width:min(430px,100%);background:var(--white);border:1px solid var(--line);padding:38px;border-radius:8px;box-shadow:0 18px 50px #12352b18}.brand{font-size:13px;letter-spacing:2px;color:var(--teal);font-weight:700}.auth h1{font-size:30px;margin:12px 0 8px}.auth p{color:var(--muted);margin:0 0 28px}.label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.token-row{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fbfcfc}.token-row input{border:0;outline:0;padding:12px;min-width:0;flex:1;background:transparent}.token-row button{background:transparent;color:var(--muted);padding:0 12px}.primary{background:var(--teal);color:#fff;border-radius:5px;padding:11px 18px;font-weight:650}.primary:hover{background:var(--teal-dark)}.error{color:var(--red);background:#fff0f1;border:1px solid #f2c6cb;border-radius:5px;padding:10px;margin:14px 0;font-size:13px}.auth small{display:block;color:var(--muted);margin-top:16px}
.shell{min-height:100vh}.topbar{height:62px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.topbar strong{font-size:17px}.topbar .identity{color:var(--muted);margin-right:14px}.topbar button{color:var(--teal);background:transparent}.lobby{max-width:980px;margin:70px auto;padding:0 24px}.lobby h1{font-size:32px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 34px}.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:24px}.panel h2{font-size:17px;margin:0 0 6px}.panel p{color:var(--muted);margin:0 0 20px}.field{margin:14px 0}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:5px;outline-color:var(--teal);background:#fff}.field input:focus{border-color:var(--teal)}
.room{height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 330px;overflow:hidden}.stage{min-width:0;display:flex;flex-direction:column;padding:20px 24px 0}.room-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.room-head h1{font-size:20px;margin:0}.meeting-meta{color:var(--muted);font-size:12px}.meeting-meta button{background:transparent;color:var(--teal);padding:2px 0}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status i{width:8px;height:8px;border-radius:50%;background:#aeb8be}.status.live{color:#16704e}.status.live i{background:#2aab76}.video-grid{flex:1;min-height:180px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-content:start;gap:12px;overflow:auto}.video-tile{position:relative;min-height:150px;aspect-ratio:16/10;background:#18242b;border-radius:7px;overflow:hidden;border:1px solid #24363e}.video-tile video{display:block;width:100%;height:100%;object-fit:cover;background:#18242b}.video-tile .tile-name{position:absolute;left:10px;bottom:9px;color:#fff;font-size:12px;background:#071317bb;padding:4px 7px;border-radius:3px}.video-tile .avatar{position:absolute;inset:0;display:grid;place-items:center;color:#b9d2d0;font-size:34px;font-weight:600}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:240px;border:1px dashed #bfccd1;border-radius:7px;color:var(--muted);text-align:center}.controls{display:flex;justify-content:center;gap:10px;padding:18px 0}.control{background:#e0e7e9;color:var(--ink);width:46px;height:42px;border-radius:6px;font-size:18px}.control span{display:block;font-size:10px;margin-top:2px}.control.active{background:var(--teal);color:#fff}.control.end{background:var(--red);color:#fff;width:auto;padding:0 17px;font-size:13px}
.sidebar{background:var(--white);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:transparent;padding:17px 5px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:650}.tab-pane{display:none;padding:18px;flex:1;min-height:0;overflow:auto}.tab-pane.active{display:flex;flex-direction:column}.chat-list{flex:1;overflow:auto}.chat-message{padding:9px 0;border-bottom:1px solid #edf0f1}.chat-message b{display:block;font-size:12px;color:var(--teal)}.chat-message small{color:var(--muted)}.chat-compose{display:flex;gap:7px;margin-top:12px}.chat-compose input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:5px}.chat-compose button{padding:0 13px;background:var(--teal);color:#fff;border-radius:5px}.member{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf0f1}.member small{display:block;color:var(--muted)}.member button,.link-btn{background:transparent;color:var(--teal);font-size:12px}.manage-section{border-bottom:1px solid #edf0f1;padding:0 0 18px;margin-bottom:18px}.manage-section h3{font-size:13px;margin:0 0 10px}.manage-section .row{display:flex;gap:7px;flex-wrap:wrap}.manage-section select{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit}.manage-section button{background:#e8eff0;color:var(--ink);padding:8px 10px;border-radius:4px;font-size:12px}.manage-section button.danger{color:var(--red)}.diagnostics{border-top:1px solid var(--line);padding:0 18px}.diagnostics summary{cursor:pointer;color:var(--muted);padding:13px 0;font-size:12px}.log{height:150px;overflow:auto;background:#f3f5f5;padding:8px;font:11px/1.5 ui-monospace,monospace;color:#66727d}.log div{border-bottom:1px solid #e4e9e9}.log .err{color:var(--red)}.log .ok{color:#16704e}.toast{position:fixed;right:22px;top:78px;z-index:5;max-width:380px;background:#17252a;color:#fff;border-left:4px solid var(--teal);padding:13px 16px;border-radius:5px;box-shadow:0 8px 25px #0002}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:#d18a22}
@media(max-width:800px){.topbar{padding:0 16px}.topbar .identity{display:none}.room{height:auto;min-height:calc(100vh - 62px);display:block;overflow:visible}.stage{padding:16px 14px 0;min-height:calc(100vh - 62px)}.video-grid{min-height:45vh;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.video-tile{min-height:105px}.sidebar{border-left:0;border-top:1px solid var(--line);min-height:370px}.lobby{margin:36px auto}.lobby-grid{grid-template-columns:1fr}.auth-card{padding:28px}}
</style>
</head>
<body>
<div id="toast" class="toast hidden" role="alert"></div>
<section id="authView" class="auth"><div class="auth-card"><div class="brand">LIVE / VIDEO</div><h1>进入会面</h1><p>使用你的 JWT Token 登录，然后创建或加入一个安全的会议。</p><label class="label" for="authToken">JWT Token</label><div class="token-row"><input id="authToken" type="password" autocomplete="off" placeholder="粘贴 JWT Token"><button id="toggleToken" type="button" aria-label="显示或隐藏 token">显示</button></div><div id="authError" class="error hidden"></div><button id="loginBtn" class="primary" style="width:100%;margin-top:16px">登录并继续</button><small>Token 只保存在当前浏览器的 localStorage 中。</small></div></section>
<section id="appView" class="shell hidden"><header class="topbar"><strong>Live 会面</strong><div><span id="userIdentity" class="identity"></span><button id="logoutBtn">退出登录</button></div></header><main id="lobbyView" class="lobby"><h1>准备开始</h1><p class="sub">创建新的会议，或使用会议号加入已有会面。</p><div class="lobby-grid"><div class="panel"><h2>创建会议</h2><p>立即建立一个新的会议空间。</p><div class="field"><label class="label" for="createTitle">会议名称</label><input id="createTitle" placeholder="例如：产品评审"></div><button id="createBtn" class="primary">创建并进入</button></div><div class="panel"><h2>加入会议</h2><p>输入会议号，与团队成员见面。</p><div class="field"><label class="label" for="joinNo">会议号</label><input id="joinNo" placeholder="输入会议号"></div><div class="field"><label class="label" for="joinName">你的名字</label><input id="joinName" placeholder="自动生成"></div><button id="joinBtn" class="primary">加入会议</button></div></div></main><main id="roomView" class="room hidden"><section class="stage"><div class="room-head"><div><h1 id="roomTitle">会议</h1><div class="meeting-meta">会议号 <button id="copyMeeting">复制</button> <span id="meetingLabel"></span></div></div><div id="connectionStatus" class="status"><i></i><span>准备连接</span></div></div><div id="videoGrid" class="video-grid"><div class="empty"><div><strong>等待其他成员加入</strong><br><span>打开摄像头后，你会出现在这里</span></div></div></div><div class="controls"><button id="camBtn" class="control active" title="摄像头">▣<span>摄像头</span></button><button id="micBtn" class="control active" title="麦克风">◉<span>麦克风</span></button><button id="shareBtn" class="control" title="屏幕共享">▤<span>共享屏幕</span></button><button id="leaveBtn" class="control end">离开会议</button></div></section><aside class="sidebar"><nav class="tabs"><button class="active" data-tab="chatPane">群聊</button><button data-tab="memberPane">成员</button><button data-tab="managePane">管理</button></nav><div id="chatPane" class="tab-pane active"><div id="chatList" class="chat-list"></div><div class="chat-compose"><input id="chatText" placeholder="发送群聊消息"><button id="chatBtn">发送</button></div></div><div id="memberPane" class="tab-pane"><div id="memberList"></div><button id="refreshBtn" class="link-btn" style="margin-top:16px">刷新成员</button></div><div id="managePane" class="tab-pane"><div class="manage-section"><h3>选择成员</h3><select id="targetId"><option value="">选择成员</option></select><div class="row" style="margin-top:8px"><button id="muteAudioBtn">静音音频</button><button id="muteVideoBtn">关闭视频</button><button id="kickBtn" class="danger">踢出成员</button></div></div><div class="manage-section"><h3>会议操作</h3><button id="endBtn" class="danger">结束会议</button></div><div class="manage-section"><h3>Data / RPC</h3><input id="dataText" placeholder="Data 内容" value="hello data"><div class="row" style="margin-top:8px"><button id="dataBtn">发送 Data</button><button id="rpcBtn">调用 RPC</button></div></div></div><details class="diagnostics"><summary>诊断日志</summary><div id="log" class="log"></div></details></aside></main></section>
<script>
(function(){'use strict';
var room=null, Room, RoomEvent, Track, token=localStorage.getItem('live_jwt')||'', meetingNo='', identity='', displayName='';
function $(id){return document.getElementById(id)} function text(id){return $(id).value.trim()}
function log(message,kind){var d=document.createElement('div');d.className=kind||'info';d.textContent='['+new Date().toLocaleTimeString()+'] '+message;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;console.log(message)}
function notify(message,kind){var t=$('toast');t.textContent=message;t.className='toast '+(kind||'');clearTimeout(notify.timer);notify.timer=setTimeout(function(){t.className='toast hidden'},5000);log(message,kind==='err'?'err':kind==='warn'?'warn':'info')}
function setBusy(id,busy){var b=$(id);b.disabled=busy;if(busy)b.dataset.label=b.textContent;b.textContent=busy?'处理中…':(b.dataset.label||b.textContent)}
function apiError(message,status){var e=new Error(message);e.status=status;return e}
async function api(path,body,method){var opts={method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}};if(body)opts.body=JSON.stringify(body);var res;try{res=await fetch(path.startsWith('http')?path:(window.location.origin+path),opts)}catch(e){throw apiError('网络连接失败，请检查网关地址',0)}var json=await res.json().catch(function(){return{code:-1,msg:res.statusText}});if(!res.ok||json.code!==0){var msg=json.msg||('请求失败（HTTP '+res.status+'）');if(res.status===401||json.code===104101)msg='登录已失效，请重新登录';throw apiError(msg,res.status)}return json.data}
function escapeValue(value){return String(value||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ensureSdk(){if(!window.LivekitClient)throw new Error('LiveKit SDK 加载失败，请刷新页面');Room=window.LivekitClient.Room;RoomEvent=window.LivekitClient.RoomEvent;Track=window.LivekitClient.Track}
function decodeClaim(jwt){try{var p=jwt.split('.')[1];var obj=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));return obj}catch(e){return{}}}
function defaults(){var c=decodeClaim(token);identity=String(c.sub||c.user_id||c.userId||'user-'+Math.random().toString(36).slice(2,8));displayName=String(c.name||c.nickname||identity);$('userIdentity').textContent=displayName+' · '+identity;$('joinName').value=displayName}
function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');defaults() }
async function login(){var value=text('authToken');if(!value){$('authError').textContent='请输入 JWT Token';$('authError').classList.remove('hidden');return}setBusy('loginBtn',true);$('authError').classList.add('hidden');token=value;localStorage.setItem('live_jwt',token);try{var probe=await api('/live/v1/meeting/participants?meetingNo=token-validation');log('Token 校验通过','ok');showApp()}catch(e){if(e.status===401||e.message.indexOf('登录已失效')>=0){localStorage.removeItem('live_jwt');token='';$('authError').textContent='Token 无效或已过期，请重新输入';$('authError').classList.remove('hidden')}else{showApp();notify('已保存登录状态。业务请求将返回：'+e.message,'warn')}}finally{setBusy('loginBtn',false)}}
function showLobby(){ $('lobbyView').classList.remove('hidden');$('roomView').classList.add('hidden') }
async function createMeeting(){setBusy('createBtn',true);try{var data=await api('/live/v1/meeting/create',{title:text('createTitle')||'Live 会面'});meetingNo=data.meeting.meetingNo;await enterMeeting(meetingNo)}catch(e){notify(e.message,'err')}finally{setBusy('createBtn',false)}}
async function joinMeeting(){var no=text('joinNo');if(!no){notify('请输入会议号','warn');return}meetingNo=no;displayName=text('joinName')||displayName;setBusy('joinBtn',true);try{await enterMeeting(no)}catch(e){notify(e.message,'err')}finally{setBusy('joinBtn',false)}}
async function enterMeeting(no){ensureSdk();var data=await api('/live/v1/meeting/join',{meetingNo:no,identity:identity,name:displayName});$('roomTitle').textContent=displayName+' 的会面';$('meetingLabel').textContent=no;showRoom();await connect(data.wsUrl||'ws://127.0.0.1:7880',data.token)}
function showRoom(){$('lobbyView').classList.add('hidden');$('roomView').classList.remove('hidden');setStatus('正在连接',false)}
function setStatus(s,live){$('connectionStatus').querySelector('span').textContent=s;$('connectionStatus').className='status '+(live?'live':'')}
async function connect(url,jwt){try{room=new Room({adaptiveStream:true,dynacast:true});bindEvents();room.registerRpcMethod('echo',function(data){log('收到 RPC：'+data.callerIdentity,'ok');return data.payload});await room.connect(url,jwt);setStatus('已连接',true);log('已进入会议','ok');await room.localParticipant.setCameraEnabled(true).catch(function(){notify('摄像头权限未开启，可在底部重新开启','warn')});await room.localParticipant.setMicrophoneEnabled(true).catch(function(){notify('麦克风权限未开启，可在底部重新开启','warn')});renderMembers();startPoll()}catch(e){setStatus('连接失败',false);notify('LiveKit 连接失败：'+e.message,'err');closeRoom()}}
function closeRoom(){if(room){try{room.disconnect()}catch(e){}room=null}$('videoGrid').replaceChildren();var empty=document.createElement('div');empty.className='empty';empty.textContent='你已离开会议';$('videoGrid').appendChild(empty);$('memberList').replaceChildren();showLobby();setStatus('准备连接',false)}
function sourceLabel(source){return source===Track.Source.Camera?'camera':source===Track.Source.ScreenShare?'screen':String(source)}
function tile(pid,name,source,sid){var d=document.createElement('div');d.className='video-tile';d.dataset.pid=pid;d.dataset.source=source;if(sid)d.dataset.sid=sid;var v=document.createElement('video');v.autoplay=true;v.playsInline=true;var a=document.createElement('div');a.className='avatar';a.textContent=(name||pid).slice(0,1).toUpperCase();var n=document.createElement('div');n.className='tile-name';n.textContent=name||pid;d.append(v,a,n);$('videoGrid').querySelector('.empty')?.remove();$('videoGrid').appendChild(d);return d}
function bindEvents(){var r=room;r.on(RoomEvent.ParticipantConnected,function(p){log('成员加入：'+p.identity,'ok');renderMembers()});r.on(RoomEvent.ParticipantDisconnected,function(p){log('成员离开：'+p.identity,'info');renderMembers()});r.on(RoomEvent.TrackSubscribed,function(track,pub,p){var d=tile(p.identity,p.name||p.identity,sourceLabel(pub.source),pub.trackSid);track.attach(d.querySelector('video'))});r.on(RoomEvent.TrackUnsubscribed,function(track,pub,p){track.detach();var d=$('videoGrid').querySelector('[data-sid="'+CSS.escape(pub.trackSid)+'"]');if(d)d.remove()});r.on(RoomEvent.LocalTrackPublished,function(pub,p){if(pub.source===Track.Source.Camera||pub.source===Track.Source.ScreenShare){var d=tile(p.identity+'-local',p.name||displayName,sourceLabel(pub.source),pub.trackSid);if(pub.videoTrack)pub.videoTrack.attach(d.querySelector('video'))}});r.on(RoomEvent.LocalTrackUnpublished,function(pub){var d=$('videoGrid').querySelector('[data-sid="'+CSS.escape(pub.trackSid)+'"]');if(d)d.remove()});r.on(RoomEvent.DataReceived,function(payload,p,kind,topic){var msg=new TextDecoder().decode(payload);if(topic==='lk.chat'||topic==='chat')appendChat(p?p.name||p.identity:'系统',msg);log('收到 Data · '+(topic||'无主题'),'info')});r.on(RoomEvent.ChatMessage,function(msg,p){appendChat(p?p.name||p.identity:'系统',msg.message)});r.on(RoomEvent.Disconnected,function(){setStatus('已断开',false);notify('会议连接已断开','warn')})}
function appendChat(from,msg){var d=document.createElement('div');d.className='chat-message';var b=document.createElement('b');b.textContent=from;var s=document.createElement('small');s.textContent=msg;d.append(b,s);$('chatList').appendChild(d);$('chatList').scrollTop=$('chatList').scrollHeight}
function renderMembers(){if(!room)return;var list=$('memberList');list.replaceChildren();var all=[room.localParticipant];room.remoteParticipants.forEach(function(p){all.push(p)});all.forEach(function(p){var d=document.createElement('div');d.className='member';var info=document.createElement('span');var b=document.createElement('b');b.textContent=p.name||p.identity;var s=document.createElement('small');s.textContent=p.identity+(p===room.localParticipant?' · 我':'');info.append(b,s);var btn=document.createElement('button');btn.textContent='选择';btn.addEventListener('click',function(){$('targetId').value=p.identity});d.append(info,btn);list.appendChild(d)})}
async function media(kind){if(!room){notify('请先加入会议','warn');return}try{if(kind==='camera'){var on=!room.localParticipant.isCameraEnabled;await room.localParticipant.setCameraEnabled(on);$('camBtn').classList.toggle('active',on);$('camBtn').querySelector('span').textContent=on?'摄像头':'开启摄像头'}else if(kind==='mic'){var on=!room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(on);$('micBtn').classList.toggle('active',on);$('micBtn').querySelector('span').textContent=on?'麦克风':'开启麦克风'}else{var on=!room.localParticipant.isScreenShareEnabled;await room.localParticipant.setScreenShareEnabled(on);$('shareBtn').classList.toggle('active',on)}log('媒体状态已更新','ok')}catch(e){notify('媒体权限或设备错误：'+e.message,'err')}}
async function chat(){if(!room)return notify('请先加入会议','warn');var msg=text('chatText');if(!msg)return;try{await room.localParticipant.publishData(new TextEncoder().encode(msg),{reliable:true,topic:'lk.chat'});appendChat('我',msg);$('chatText').value=''}catch(e){notify('群聊发送失败：'+e.message,'err')}}
async function manage(action){var target=text('targetId');if(!target)return notify('请先选择成员','warn');var body={meetingNo:meetingNo,identity:target};if(action==='kick'){if(!confirm('确定将 '+target+' 踢出会议？'))return}else if(action==='muteAudio'||action==='muteVideo'){body.muted=true;body.kind=action==='muteAudio'?'audio':'video'}try{await api('/live/v1/meeting/'+(action==='kick'?'kick':'mute'),body);notify(action==='kick'?'已踢出成员':'已发送管理指令','') }catch(e){notify(e.message,'err')}}
async function refresh(){try{var data=await api('/live/v1/meeting/participants?meetingNo='+encodeURIComponent(meetingNo));log('成员列表已刷新','ok');if(data.participants)renderMembers()}catch(e){notify(e.message,'err')}}
async function endMeeting(){if(!confirm('确定结束整个会议？所有成员都会离开。'))return;try{await api('/live/v1/meeting/end',{meetingNo:meetingNo});notify('会议已结束','');closeRoom()}catch(e){notify(e.message,'err')}}
async function sendData(){if(!room)return notify('请先加入会议','warn');try{await room.localParticipant.publishData(new TextEncoder().encode(text('dataText')),{reliable:true,topic:'data'});notify('Data 已发送','')}catch(e){notify('Data 发送失败：'+e.message,'err')}}
async function rpc(){if(!room)return notify('请先加入会议','warn');var target=text('targetId');if(!target)return notify('请先选择成员','warn');try{var response=await room.localParticipant.performRpc({destinationIdentity:target,method:'echo',payload:text('dataText')});notify('RPC 返回：'+response,'')}catch(e){notify('RPC 失败：'+e.message,'err')}}
function logout(){if(room)closeRoom();token='';localStorage.removeItem('live_jwt');$('appView').classList.add('hidden');$('authView').classList.remove('hidden');$('authToken').value='';}
 $('loginBtn').addEventListener('click',login);$('authToken').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('toggleToken').addEventListener('click',function(){var i=$('authToken');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'显示':'隐藏'});$('logoutBtn').addEventListener('click',logout);$('createBtn').addEventListener('click',createMeeting);$('joinBtn').addEventListener('click',joinMeeting);$('leaveBtn').addEventListener('click',function(){if(confirm('确定离开会议？'))closeRoom()});$('camBtn').addEventListener('click',function(){media('camera')});$('micBtn').addEventListener('click',function(){media('mic')});$('shareBtn').addEventListener('click',function(){media('share')});$('chatBtn').addEventListener('click',chat);$('chatText').addEventListener('keydown',function(e){if(e.key==='Enter')chat()});$('kickBtn').addEventListener('click',function(){manage('kick')});$('muteAudioBtn').addEventListener('click',function(){manage('muteAudio')});$('muteVideoBtn').addEventListener('click',function(){manage('muteVideo')});$('refreshBtn').addEventListener('click',refresh);$('endBtn').addEventListener('click',endMeeting);$('dataBtn').addEventListener('click',sendData);$('rpcBtn').addEventListener('click',rpc);$('copyMeeting').addEventListener('click',function(){if(!navigator.clipboard)return notify('当前浏览器不支持复制','warn');navigator.clipboard.writeText(meetingNo).then(function(){notify('会议号已复制','')}).catch(function(){notify('复制失败，请手动记录会议号','warn')})});document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tabs button,.tab-pane').forEach(function(x){x.classList.remove('active')});b.classList.add('active');$(b.dataset.tab).classList.add('active')})});if(token){$('authToken').value=token;login()}
})();
</script>
