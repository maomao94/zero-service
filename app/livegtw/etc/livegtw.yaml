Name: livegtw
Host: 0.0.0.0
Port: 11002
Timeout: 10000
Mode: dev
MaxBytes: 10485760
Log:
  Encoding: plain
  #  Mode: file
  Path: /opt/logs/livegtw
  Level: info
  KeepDays: 300
JwtAuth:
  AccessSecret: 629c6233-1a76-471b-bd25-b87208762219
  # ClaimMapping: 内部标准 key -> 外部 JWT claim key（internalKey -> externalKey，如 user-id -> user_id）
  ClaimMapping:
    user-id: "user_id"
    user-name: "user_name"
    dept-code: "dept_code"
LiveRpcConf:
  Endpoints:
    - 127.0.0.1:21017
  NonBlock: true
  Timeout: 5000
LiveKit:
  WebhookKey: secret
EnableTestPage: true