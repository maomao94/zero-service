Name: livegtw
Host: 0.0.0.0
Port: 11002
Timeout: 10000
Mode: dev
MaxBytes: 10485760
Log:
  Encoding: plain
  #  Mode: file
  Path: /opt/logs/livegtw
  Level: info
  KeepDays: 300
JwtAuth:
  AccessSecret: 629c6233-1a76-471b-bd25-b87208762219
LiveRpcConf:
  Endpoints:
    - 127.0.0.1:21017
  NonBlock: true
  Timeout: 5000
LiveKit:
  WebhookKey: secretsecretsecretsecretsecretsecret
EnableTestPage: true
# Token 签发配置
TokenSign:
  # 签发密钥（验证调用方身份，调用时需传入相同值）
  SignKey: "token-sign-key-2024"
  # 默认过期时间（秒）
  DefaultExpireSeconds: 3600
# 错误折叠策略：默认不折叠，所有已登记平台码统一透传。
# 需要把指定错误码折叠成 100002 时，打开 Enabled 并列出 Codes。
Error:
  Fold:
    Enabled: false
    # Target: 100002
    # KeepMsg: false
    # Codes:
    #   - 100019
    #   - 100030
    #   - 100031
    #   - 100054
    #   - 100057
    #   - 100001
