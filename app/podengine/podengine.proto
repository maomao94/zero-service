syntax = "proto3";

package podengine;

import "validate/validate.proto";
//import "extproto.proto";

option go_package = "./podengine";
option java_multiple_files = true;
option java_package = "com.github.podengine.grpc";
option java_outer_classname = "PodEngineProto";


// PodEngine 提供 Pod 生命周期管理能力
// 抽象 Pod / Container 运行模型，可适配 Docker / Kubernetes 等运行时
service PodEngine {
  rpc CreatePod(CreatePodReq) returns (CreatePodRes);
  rpc StartPod(StartPodReq) returns (StartPodRes);
  rpc StopPod(StopPodReq) returns (StopPodRes);
  rpc RestartPod(RestartPodReq) returns (RestartPodRes);
  rpc GetPod(GetPodReq) returns (GetPodRes);
  rpc ListPods(ListPodsReq) returns (ListPodsRes);
  rpc DeletePod(DeletePodReq) returns (DeletePodRes);
  rpc GetPodStats(GetPodStatsReq) returns (GetPodStatsRes);
  rpc ListImages(ListImagesReq) returns (ListImagesRes);
}


// =======================
// Pod & Container Status
// =======================

// PodPhase 表示 Pod 的整体运行阶段（调度视角）
enum PodPhasePb {
  POD_PHASE_UNKNOWN = 0;
  POD_PHASE_PENDING = 1; // 已创建但尚未进入运行态（拉取镜像 / 创建中）
  POD_PHASE_RUNNING = 2; // 至少一个容器运行中
  POD_PHASE_SUCCEEDED = 3; // 所有容器正常完成（退出码 0）
  POD_PHASE_FAILED = 4; // 至少一个容器异常退出
  POD_PHASE_STOPPED = 5; // 被用户或系统显式停止
}


// PodConditionType 表示 Pod 在生命周期中的关键条件
// 主要用于表达“是否就绪 / 是否可服务”等状态
enum PodConditionTypePb {
  POD_CONDITION_TYPE_UNKNOWN = 0;
  POD_CONDITION_TYPE_POD_SCHEDULED = 1; // Pod 已被调度到运行节点
  POD_CONDITION_TYPE_CONTAINERS_READY = 2; // 所有容器就绪
  POD_CONDITION_TYPE_INITIALIZED = 3; // 初始化完成
  POD_CONDITION_TYPE_READY = 4; // Pod 可对外提供服务
}


// PodCondition 描述某一条件的当前状态 todo
message PodConditionPb {
  PodConditionTypePb type = 1;
  bool status = 2;
  string reason = 3;
  string message = 4;
  string last_transition_time = 5 [json_name = "lastTransitionTime"];
}


// ContainerState 表示单个容器的运行状态
message ContainerStatePb {
  bool running = 1;        // 运行中
  bool terminated = 2;     // 已终止
  bool waiting = 3;        // 等待中（创建 / 重启等）
  string reason = 4;       // 状态原因
  string message = 5;      // 状态描述
  string started_time = 6 [json_name = "startedTime"];    // 启动时间
  string finished_time = 7 [json_name = "finishedTime"];   // 结束时间
  string exit_code = 8 [json_name = "exitCode"];     // 退出码
}


// =======================
// Container Model
// =======================

// Container 表示实际运行中的容器实例
message ContainerPb {
  string name = 1;                 // 容器名称
  string image = 2;                // 镜像名称
  ContainerStatePb state = 3;        // 当前状态

  // 端口声明
  // Docker: "8080:80", "80/tcp"
  // K8s: 映射为 containerPort / service
  repeated string ports = 4;

  map<string, string> env = 5;     // 环境变量
  repeated string args = 6;        // 启动参数

  // 资源限制（CPU / Memory 等，由 runtime 解释）
  map<string, string> resources = 7;

  // 卷挂载信息
  repeated string volume_mounts = 8 [json_name = "volumeMounts"];
}


// =======================
// Spec (Desired State)
// =======================

// ContainerSpec 描述期望运行的容器规格
message ContainerSpecPb {
  string name = 1 [(validate.rules).string.min_len = 1];
  string image = 2 [(validate.rules).string.min_len = 1];

  repeated string args = 3;
  map<string, string> env = 4;

  repeated string ports = 5;
  map<string, string> resources = 6;

  // 卷挂载声明（runtime 自行解析）
  repeated string volume_mounts = 7 [json_name = "volumeMounts"];
}


// PodSpec 描述 Pod 的期望状态
message PodSpecPb {
  string name = 1 [(validate.rules).string.min_len = 1];   // Pod 逻辑名称

  // 期望运行的容器列表（支持多容器）
  repeated ContainerSpecPb containers = 2 [(validate.rules).repeated = {min_items: 1}];

  // 资源标签（元数据）
  // Docker: container labels
  // K8s: metadata.labels
  map<string, string> labels = 3;

  // 扩展注解信息
  // Docker: labels（约定前缀）
  // K8s: metadata.annotations
  map<string, string> annotations = 4;

  // 重启策略：no / onFailure / always
  string restartPolicy = 5 [(validate.rules).string = {in: ["no", "onFailure", "always"]}];

  // 优雅终止时间（秒）
  int32 termination_grace_period_seconds = 6 [json_name = "terminationGracePeriodSeconds"];

  // 网络模式：bridge / host / none / 自定义网络名称
  string networkMode = 7 [(validate.rules).string = {in: ["bridge", "host", "none"]}];

  // 网络名称：指定要使用的自定义网络名称
  string network_name = 8 [json_name = "networkName"];

  // 网络配置：额外的网络配置参数
  map<string, string> networkConfig = 9;
}


// =======================
// Pod Model (Observed State)
// =======================

// Pod 表示系统中一个已创建或运行中的 Pod 实例
message PodPb {
  string id = 1;               // Pod ID（runtime 生成）
  string name = 2;             // Pod 名称
  PodPhasePb phase = 3;          // 当前阶段

  repeated PodConditionPb conditions = 4;
  repeated ContainerPb containers = 5;

  map<string, string> labels = 6;
  map<string, string> annotations = 7;
  string network_mode = 8 [json_name = "networkMode"]; // 网络模式

  string creation_time = 9 [json_name = "creationTime"];  // 创建时间
  string start_time = 10 [json_name = "startTime"];          // 启动时间
  string deleted_time = 11 [json_name = "deletedTime"]; // 删除时间
}


// =======================
// RPC Messages
// =======================

message CreatePodReq {
  string node = 50; // docker 运行节点 默认-local
  string name = 1 [(validate.rules).string.min_len = 1];
  PodSpecPb spec = 2 [(validate.rules).message.required = true];
}

message CreatePodRes {
  PodPb pod = 1;
}

message StartPodReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
}

message StartPodRes {
  PodPb pod = 1;
}

message StopPodReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
  bool force = 2;
}

message StopPodRes {
}

message RestartPodReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
}

message RestartPodRes {
  PodPb pod = 1;
}

message GetPodReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
}

message GetPodRes {
  PodPb pod = 1;
}

message ListPodsReq {
  string node = 50; // docker 运行节点 默认-local
  int32 limit = 1 [(validate.rules).int32.lte = 1000];
  int32 offset = 2 [(validate.rules).int32.lte = 1000];
  repeated string names = 3;
  repeated string ids = 4;
  map<string, string> labels = 5;
}

message ListPodsRes {
  repeated ListPodItemPb items = 1;
  int32 total = 2;
}

message ListPodItemPb {
  string id = 1;
  string name = 2;
  PodPhasePb phase = 3;
  string create_time = 4 [json_name = "createTime"];
  string image = 5;
  string image_id = 6 [json_name = "imageId"];
  string command = 7;
  repeated string ports = 8;
  int64 size_rw = 9 [json_name = "sizeRw"];
  int64 size_root_fs = 10 [json_name = "sizeRootFs"];
  map<string, string> labels = 11;
  string state = 12;
  string status = 13;
  string network_mode = 14 [json_name = "networkMode"];
  repeated string mounts = 15;
}

message DeletePodReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
  bool force = 2;
  bool remove_volumes = 3 [json_name = "removeVolumes"];
}

message DeletePodRes {
}

message GetPodStatsReq {
  string node = 50; // docker 运行节点 默认-local
  string id = 1 [(validate.rules).string.min_len = 1];
}

message GetPodStatsRes {
  repeated ContainerStatsPb stats = 1;
}

message ContainerStatsPb {
  string container_id = 1 [json_name = "containerId"];
  string container_name = 2 [json_name = "containerName"];

  // CPU 统计信息
  double cpu_usage_percent = 3 [json_name = "cpuUsagePercent"];
  string cpu_usage_percent_display = 4 [json_name = "cpuUsagePercentDisplay"]; // 用于展示
  int64 cpu_usage_total = 5 [json_name = "cpuUsageTotal"];
  string cpu_usage_total_display = 6 [json_name = "cpuUsageTotalDisplay"]; // 用于展示

  // 内存统计信息
  int64 memory_usage = 7 [json_name = "memoryUsage"];
  string memory_usage_display = 8 [json_name = "memoryUsageDisplay"]; // 用于展示
  int64 memory_limit = 9 [json_name = "memoryLimit"];
  string memory_limit_display = 10 [json_name = "memoryLimitDisplay"]; // 用于展示
  double memory_usage_percent = 11 [json_name = "memoryUsagePercent"];
  string memory_usage_percent_display = 12 [json_name = "memoryUsagePercentDisplay"]; // 用于展示

  // 网络统计信息
  int64 network_rx_bytes = 13 [json_name = "networkRxBytes"];
  string network_rx_bytes_display = 14 [json_name = "networkRxBytesDisplay"]; // 用于展示
  int64 network_tx_bytes = 15 [json_name = "networkTxBytes"];
  string network_tx_bytes_display = 16 [json_name = "networkTxBytesDisplay"]; // 用于展示

  // 存储统计信息
  int64 storage_read_bytes = 17 [json_name = "storageReadBytes"];
  string storage_read_bytes_display = 18 [json_name = "storageReadBytesDisplay"]; // 用于展示
  int64 storage_write_bytes = 19 [json_name = "storageWriteBytes"];
  string storage_write_bytes_display = 20 [json_name = "storageWriteBytesDisplay"]; // 用于展示

  // 统计时间
  string timestamp = 21;
}

message ListImagesReq {
  string node = 50; // docker 运行节点 默认-local
  int32 limit = 1 [(validate.rules).int32.lte = 1000];
  int32 offset = 2 [(validate.rules).int32.lte = 1000];
  repeated string references = 3;
  bool include_digests = 4 [json_name = "includeDigests"];
}

message ListImagesRes {
  repeated ImagePb items = 1;
  int32 total = 2;
}

// Image 表示系统中的镜像信息
message ImagePb {
  string id = 1;               // 镜像 ID
  repeated string references = 2;    // 镜像标签列表（完整引用，如 ubuntu:latest）
  repeated string digests = 3; // 镜像摘要列表
  int64 size = 4;              // 镜像大小（字节）
  string size_display = 5 [json_name = "sizeDisplay"];      // 用于展示的大小
  string created_at = 6 [json_name = "createdAt"];        // 创建时间
  map<string, string> labels = 7; // 镜像标签
}