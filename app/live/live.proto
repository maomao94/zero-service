syntax = "proto3";

package live;
option go_package = "./live";
option java_multiple_files = true;
option java_package = "com.github.live.grpc";
option java_outer_classname = "LiveProto";

// LiveRpc 会议业务服务：管理会议单据、发放入会 token、LiveKit 管理操作与 webhook 状态同步。
service LiveRpc {
  // 创建会议（落库 + 创建 LiveKit 房间）
  rpc CreateMeeting(CreateMeetingReq) returns (CreateMeetingRes);
  // 加入会议（校验会议后发放 join token，浏览器直连 LiveKit）
  rpc JoinMeeting(JoinMeetingReq) returns (JoinMeetingRes);
  // 查询会议详情
  rpc GetMeeting(GetMeetingReq) returns (GetMeetingRes);
  // 分页查询会议列表
  rpc ListMeetings(ListMeetingsReq) returns (ListMeetingsRes);
  // 结束会议（删除 LiveKit 房间 + 状态流转，Redis lock 防重入）
  rpc EndMeeting(EndMeetingReq) returns (EndMeetingRes);
  // 踢人（移除指定参与者）
  rpc KickParticipant(KickParticipantReq) returns (KickParticipantRes);
  // 静音/取消静音参与者音频或视频
  rpc MuteParticipant(MuteParticipantReq) returns (MuteParticipantRes);
  // 查询会议参与者
  rpc ListParticipants(ListParticipantsReq) returns (ListParticipantsRes);
  // 向会议发送 Data（destinations 为空则广播）
  rpc SendMeetingData(SendMeetingDataReq) returns (SendMeetingDataRes);
  // 服务端对参与者执行 RPC
  rpc PerformMeetingRpc(PerformMeetingRpcReq) returns (PerformMeetingRpcRes);
  // 接收 LiveKit webhook 事件（由 livegtw 验签后转发）
  rpc WebhookNotify(WebhookNotifyReq) returns (WebhookNotifyRes);
  // 生成会议邀请票据（需要鉴权）
  rpc GenerateMeetingTicket(GenerateMeetingTicketReq) returns (GenerateMeetingTicketRes);
  // 根据票据加入会议（不需要鉴权）
  rpc JoinMeetingByTicket(JoinMeetingByTicketReq) returns (JoinMeetingByTicketRes);
  // 上报聊天消息
  rpc ReportMeetingMessage(ReportMeetingMessageReq) returns (ReportMeetingMessageRes);
  // 查询聊天记录
  rpc ListMeetingMessages(ListMeetingMessagesReq) returns (ListMeetingMessagesRes);
  // 发起 SIP 外呼（拨打电话或在会议中邀请电话参会者）
  rpc DialSip(DialSipReq) returns (DialSipRes);
  // 创建 SIP 供应商
  rpc CreateSipProvider(CreateSipProviderReq) returns (CreateSipProviderRes);
  // 更新 SIP 供应商（含启用/禁用）
  rpc UpdateSipProvider(UpdateSipProviderReq) returns (UpdateSipProviderRes);
  // 列出 SIP 供应商
  rpc ListSipProviders(ListSipProvidersReq) returns (ListSipProvidersRes);
  // 删除 SIP 供应商
  rpc DeleteSipProvider(DeleteSipProviderReq) returns (DeleteSipProviderRes);
}

// MeetingInfo 会议单据信息。
message MeetingInfo {
  // 业务会议号（= LiveKit 房间名）
  string meeting_no = 1 [json_name = "meetingNo"];
  // 用户会议号（9位数字）
  string meeting_code = 2 [json_name = "meetingCode"];
  // 会议标题
  string title = 3 [json_name = "title"];
  // 会议状态：1-已创建，2-进行中，3-已结束
  int32 status = 4 [json_name = "status"];
  // 创建人（gRPC metadata user-id）
  string create_user = 5 [json_name = "createUser"];
  // 更新人（gRPC metadata user-id）
  string update_user = 6 [json_name = "updateUser"];
  // 机构 code
  string dept_code = 7 [json_name = "deptCode"];
  // 开始时间，格式：yyyy-MM-dd HH:mm:ss
  string start_time = 8 [json_name = "startTime"];
  // 结束时间，格式：yyyy-MM-dd HH:mm:ss（未结束为空字符串）
  string end_time = 9 [json_name = "endTime"];
  // 创建时间，格式：yyyy-MM-dd HH:mm:ss
  string create_time = 10 [json_name = "createTime"];
  // 无人时房间保留秒数（默认 600）
  uint32 empty_timeout = 11 [json_name = "emptyTimeout"];
  // 所有人离开后保留秒数（默认 120）
  uint32 departure_timeout = 12 [json_name = "departureTimeout"];
  // 最大参会人数（默认 50）
  uint32 max_participants = 13 [json_name = "maxParticipants"];
  // LiveKit 房间 Sid（用于 Egress/Webhook 等场景）
  string room_sid = 14 [json_name = "roomSid"];
  // 会议元数据 JSON
  string metadata = 15 [json_name = "metadata"];
}

message CreateMeetingReq {
  // 会议标题
  string title = 1 [json_name = "title"];
  // 无人时房间保留秒数（默认 600）
  uint32 empty_timeout = 2 [json_name = "emptyTimeout"];
  // 所有人离开后保留秒数（默认 120，防刷新断连）
  uint32 departure_timeout = 3 [json_name = "departureTimeout"];
  // 最大参会人数（默认 50）
  uint32 max_participants = 4 [json_name = "maxParticipants"];
  // 会议元数据 JSON（可选）
  string metadata = 5 [json_name = "metadata"];
}

message CreateMeetingRes {
  // 会议信息
  MeetingInfo meeting = 1 [json_name = "meeting"];
}

message JoinMeetingReq {
  // 会议号（与 meeting_code 二选一）
  string meeting_no = 1 [json_name = "meetingNo"];
  // 用户会议号（9位数字，与 meeting_no 二选一）
  string meeting_code = 2 [json_name = "meetingCode"];
  // 参会人身份（房间内唯一）
  string identity = 3 [json_name = "identity"];
  // 展示名（可空）
  string name = 4 [json_name = "name"];
  // 是否可以发布音视频（默认 true，总开关）
  bool can_publish = 5 [json_name = "canPublish"];
  // 是否可以订阅音视频（默认 true）
  bool can_subscribe = 6 [json_name = "canSubscribe"];
  // 是否可以发布数据（默认 true）
  bool can_publish_data = 7 [json_name = "canPublishData"];
  // 可以发布的轨道源类型（默认为空，表示允许所有）
  repeated string can_publish_sources = 8 [json_name = "canPublishSources"];
}

message JoinMeetingRes {
  // join token（浏览器直连 LiveKit 使用）
  string token = 1 [json_name = "token"];
  // LiveKit WebSocket 地址
  string ws_url = 2 [json_name = "wsUrl"];
  // 会议信息
  MeetingInfo meeting = 3 [json_name = "meeting"];
  // 是否可以发布音视频
  bool can_publish = 4 [json_name = "canPublish"];
  // 是否可以订阅音视频
  bool can_subscribe = 5 [json_name = "canSubscribe"];
  // 是否可以发布数据
  bool can_publish_data = 6 [json_name = "canPublishData"];
  // 可以发布的轨道源类型（空表示允许所有）
  repeated string can_publish_sources = 7 [json_name = "canPublishSources"];
}

message GetMeetingReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
}

message GetMeetingRes {
  // 会议信息
  MeetingInfo meeting = 1 [json_name = "meeting"];
}

message ListMeetingsReq {
  // 过滤状态，0 表示全部
  int32 status = 1 [json_name = "status"];
  // 页码，从 1 开始
  int64 page = 2 [json_name = "page"];
  // 每页数量
  int64 page_size = 3 [json_name = "pageSize"];
  // 创建开始时间，格式：yyyy-MM-dd
  string create_time_start = 4 [json_name = "createTimeStart"];
  // 创建结束时间，格式：yyyy-MM-dd
  string create_time_end = 5 [json_name = "createTimeEnd"];
  // 机构号
  string dept_code = 6 [json_name = "deptCode"];
  // 创建人
  string create_user = 7 [json_name = "createUser"];
  // 标题模糊查询
  string title = 8 [json_name = "title"];
  // 参会人身份（按参会人检索，查询与某用户相关的会议）
  string identity = 9 [json_name = "identity"];
}

message ListMeetingsRes {
  // 会议列表
  repeated MeetingInfo meetings = 1 [json_name = "meetings"];
  // 总数量
  int64 total = 2 [json_name = "total"];
}

message EndMeetingReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
}

message EndMeetingRes {}

message KickParticipantReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 被踢参与者身份
  string identity = 2 [json_name = "identity"];
}

message KickParticipantRes {}

message MuteParticipantReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 目标参与者身份
  string identity = 2 [json_name = "identity"];
  // 是否静音（true-静音，false-取消静音）
  bool muted = 3 [json_name = "muted"];
  // 轨道类型：audio | video
  string kind = 4 [json_name = "kind"];
}

message MuteParticipantRes {}

message ParticipantInfo {
  // 参与者身份
  string identity = 1 [json_name = "identity"];
  // 展示名
  string name = 2 [json_name = "name"];
  // 参会状态：1-已加入，2-已离开
  int32 status = 3 [json_name = "status"];
  // 加入时间，格式：yyyy-MM-dd HH:mm:ss
  string join_time = 4 [json_name = "joinTime"];
  // 离开时间，格式：yyyy-MM-dd HH:mm:ss（未离开为空字符串）
  string left_time = 5 [json_name = "leftTime"];
}

message ListParticipantsReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
}

message ListParticipantsRes {
  // 参会记录列表
  repeated ParticipantInfo participants = 1 [json_name = "participants"];
}

message SendMeetingDataReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 业务约定 topic
  string topic = 2 [json_name = "topic"];
  // 任意二进制内容
  bytes payload = 3 [json_name = "payload"];
  // 目标身份，空表示广播
  repeated string destinations = 4 [json_name = "destinations"];
}

message SendMeetingDataRes {}

message PerformMeetingRpcReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 目标参与者身份
  string identity = 2 [json_name = "identity"];
  // RPC 方法名
  string method = 3 [json_name = "method"];
  // 请求负载
  string payload = 4 [json_name = "payload"];
  // 响应超时时间（毫秒），0 使用服务端默认
  uint32 response_timeout_ms = 5 [json_name = "responseTimeoutMs"];
}

message PerformMeetingRpcRes {
  // RPC 响应内容
  string response = 1 [json_name = "response"];
}

// WebhookNotifyReq LiveKit webhook 事件请求：携带 LiveKit 推送的原始
// proto 字节（livekit.WebhookEvent 序列化），由 live 服务解析后基于
// SDK 对象处理业务。
message WebhookNotifyReq {
  // LiveKit webhook 原始 proto 字节（livekit.WebhookEvent）
  bytes data = 1 [json_name = "data"];
}

message WebhookNotifyRes {}

// ===== 票据相关消息 =====

// GenerateMeetingTicketReq 生成会议邀请票据请求。
// 票据用于生成临时访客参加会议的凭证，支持权限控制，可以限制访客的操作范围。
// 当前主要给网关（livegtw）调用，用于生成临时访客票据。
// 业务侧也可以不使用网关，直接调用此接口组合生成票据，实现自定义的访客加入流程。
message GenerateMeetingTicketReq {
  // 会议号（与 meeting_code 二选一）
  string meeting_no = 1 [json_name = "meetingNo"];
  // 用户会议号（9位数字，与 meeting_no 二选一）
  string meeting_code = 2 [json_name = "meetingCode"];
  // 绑定的参会人身份（必填，用于标识访客身份，同一会议内唯一）
  string identity = 3 [json_name = "identity"];
  // 绑定的参会人名称（可选，用于显示在会议中）
  string name = 4 [json_name = "name"];
  // 票据有效期秒数（默认 3600，即 1小时）
  uint32 expire_seconds = 5 [json_name = "expireSeconds"];
  // 是否可以发布音视频（默认 true，总开关）
  bool can_publish = 6 [json_name = "canPublish"];
  // 是否可以订阅音视频（默认 true，控制访客是否能观看/收听其他人的音视频）
  bool can_subscribe = 7 [json_name = "canSubscribe"];
  // 是否可以发布数据（默认 true，控制访客是否能发送聊天消息/数据）
  bool can_publish_data = 8 [json_name = "canPublishData"];
  // 可以发布的轨道源类型（默认为空，表示允许所有）
  // 枚举值说明：
  // - camera: 摄像头
  // - microphone: 麦克风
  // - screen_share: 屏幕共享（视频）
  // - screen_share_audio: 屏幕共享音频
  repeated string can_publish_sources = 9 [json_name = "canPublishSources"];
  // 票据类型：1-一次性（默认，消费后删除），2-有效期（消费后保留至过期，可多次使用）
  int32 ticket_type = 10 [json_name = "ticketType"];
}

// GenerateMeetingTicketRes 生成会议邀请票据响应。
message GenerateMeetingTicketRes {
  // 票据字符串（用于前端传递给访客，访客用此票据加入会议）
  string ticket = 1 [json_name = "ticket"];
  // 过期时间，格式：yyyy-MM-dd HH:mm:ss（票据在此时间后失效）
  string expire_time = 2 [json_name = "expireTime"];
  // 是否可以发布音视频（回显请求中的权限设置）
  bool can_publish = 3 [json_name = "canPublish"];
  // 是否可以订阅音视频（回显请求中的权限设置）
  bool can_subscribe = 4 [json_name = "canSubscribe"];
  // 是否可以发布数据（回显请求中的权限设置）
  bool can_publish_data = 5 [json_name = "canPublishData"];
  // 可以发布的轨道源类型（回显请求中的权限设置）
  // 枚举值说明：
  // - camera: 摄像头
  // - microphone: 麦克风
  // - screen_share: 屏幕共享（视频）
  // - screen_share_audio: 屏幕共享音频
  repeated string can_publish_sources = 6 [json_name = "canPublishSources"];
  // 票据类型：1-一次性（默认），2-有效期
  int32 ticket_type = 7 [json_name = "ticketType"];
}

message JoinMeetingByTicketReq {
  // 票据字符串（已绑定会议号和参会人）
  string ticket = 1 [json_name = "ticket"];
}

message JoinMeetingByTicketRes {
  // join token（浏览器直连 LiveKit 使用）
  string token = 1 [json_name = "token"];
  // LiveKit WebSocket 地址
  string ws_url = 2 [json_name = "wsUrl"];
  // 会议信息
  MeetingInfo meeting = 3 [json_name = "meeting"];
  // 是否可以发布音视频
  bool can_publish = 4 [json_name = "canPublish"];
  // 是否可以订阅音视频
  bool can_subscribe = 5 [json_name = "canSubscribe"];
  // 是否可以发布数据
  bool can_publish_data = 6 [json_name = "canPublishData"];
  // 可以发布的轨道源类型（空表示允许所有）
  repeated string can_publish_sources = 7 [json_name = "canPublishSources"];
}

// ===== 聊天消息相关 =====

message ReportMeetingMessageReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 消息内容
  string content = 2 [json_name = "content"];
  // 消息类型（text, image, file）
  string message_type = 3 [json_name = "messageType"];
}

message ReportMeetingMessageRes {
  // 消息 ID（后台生成，用于后续 SDK 推送）
  string message_id = 1 [json_name = "messageId"];
}

message ListMeetingMessagesReq {
  // 会议号
  string meeting_no = 1 [json_name = "meetingNo"];
  // 页码，从 1 开始
  int64 page = 2 [json_name = "page"];
  // 每页数量
  int64 page_size = 3 [json_name = "pageSize"];
}

message ListMeetingMessagesRes {
  // 消息列表
  repeated MeetingMessageInfo messages = 1 [json_name = "messages"];
  // 总数量
  int64 total = 2 [json_name = "total"];
}

message MeetingMessageInfo {
  // 消息 ID
  string message_id = 1 [json_name = "messageId"];
  // 发送者 ID
  string sender_id = 2 [json_name = "senderId"];
  // 发送者名称
  string sender_name = 3 [json_name = "senderName"];
  // 消息内容
  string content = 4 [json_name = "content"];
  // 消息类型
  string message_type = 5 [json_name = "messageType"];
  // 创建时间，格式：yyyy-MM-dd HH:mm:ss
  string create_time = 6 [json_name = "createTime"];
}

// ===== SIP 电话相关 =====

// DialSipReq 发起 SIP 外呼请求。
// 支持两种场景：
//   1. 拨打电话：不传 meeting_no，自动创建 S 前缀会议
//   2. 电话会议：传 meeting_no（M 前缀），将电话参会者加入已有会议
message DialSipReq {
  // 被叫号码（必填），如 "1001"（局域网分机）或 "+8613800138000"（手机号）
  string callee_number = 1 [json_name = "calleeNumber"];
  // 会议号（可选），为空则自动创建 S 前缀会议（标题 "电话通话-{callee}"）
  // 传当前会议号（M 前缀）= 电话会议场景，将电话参会者加入已有会议
  string meeting_no = 2 [json_name = "meetingNo"];
  // 电话参会者在 Room 中的显示名（可选），不填则使用号码
  string participant_name = 3 [json_name = "participantName"];
  // SIP 供应商编码（必填），查询不到则报错
  string provider_code = 4 [json_name = "providerCode"];
}

// DialSipRes 发起 SIP 外呼响应。
message DialSipRes {
  // 会议信息（新建或已有）
  MeetingInfo meeting = 1 [json_name = "meeting"];
  // SIP 通话 ID（LiveKit 侧的 call ID）
  string sip_call_id = 2 [json_name = "sipCallId"];
}

// ===== SIP 供应商管理 =====

// SipProviderInfo SIP 供应商配置信息。
message SipProviderInfo {
  // 数据库主键 ID
  string id = 1 [json_name = "id"];
  // 供应商编码（唯一，如 "freeswitch" / "telnyx" / "aliyun"）
  string code = 2 [json_name = "code"];
  // 供应商名称
  string name = 3 [json_name = "name"];
  // SIP 服务器地址（如 "freeswitch:5080" / "sip.telnyx.com"）
  string address = 4 [json_name = "address"];
  // 主叫号码池（外呼时随机选一个作为来电显示）
  repeated string numbers = 5 [json_name = "numbers"];
  // 状态：1-启用 2-禁用
  int32 status = 6 [json_name = "status"];
  // 创建时间，格式：yyyy-MM-dd HH:mm:ss
  string create_time = 7 [json_name = "createTime"];
}

// CreateSipProviderReq 创建 SIP 供应商请求。
message CreateSipProviderReq {
  // 供应商编码（唯一，如 "freeswitch" / "telnyx"）
  string code = 1 [json_name = "code"];
  // 供应商名称
  string name = 2 [json_name = "name"];
  // SIP 服务器地址
  string address = 3 [json_name = "address"];
  // 主叫号码池
  repeated string numbers = 4 [json_name = "numbers"];
  // SIP 认证用户名（可选）
  string auth_username = 5 [json_name = "authUsername"];
  // SIP 认证密码（可选）
  string auth_password = 6 [json_name = "authPassword"];
}

// CreateSipProviderRes 创建 SIP 供应商响应。
message CreateSipProviderRes {
  // 创建的供应商信息
  SipProviderInfo provider = 1 [json_name = "provider"];
}

// UpdateSipProviderReq 更新 SIP 供应商请求。
// 所有字段均为可选，不传则不更新对应字段。
message UpdateSipProviderReq {
  // 供应商 ID（必填）
  string id = 1 [json_name = "id"];
  // 供应商名称（可选）
  string name = 2 [json_name = "name"];
  // SIP 服务器地址（可选）
  string address = 3 [json_name = "address"];
  // 主叫号码池（可选）
  repeated string numbers = 4 [json_name = "numbers"];
  // SIP 认证用户名（可选）
  string auth_username = 5 [json_name = "authUsername"];
  // SIP 认证密码（可选）
  string auth_password = 6 [json_name = "authPassword"];
  // 状态：1-启用 2-禁用（可选，0 表示不更新）
  int32 status = 7 [json_name = "status"];
}

// UpdateSipProviderRes 更新 SIP 供应商响应。
message UpdateSipProviderRes {
  // 更新后的供应商信息
  SipProviderInfo provider = 1 [json_name = "provider"];
}

// ListSipProvidersReq 列出 SIP 供应商请求。
message ListSipProvidersReq {}

// ListSipProvidersRes 列出 SIP 供应商响应。
message ListSipProvidersRes {
  // 供应商列表
  repeated SipProviderInfo providers = 1 [json_name = "providers"];
}

// DeleteSipProviderReq 删除 SIP 供应商请求。
message DeleteSipProviderReq {
  // 供应商 ID
  string id = 1 [json_name = "id"];
}

// DeleteSipProviderRes 删除 SIP 供应商响应。
message DeleteSipProviderRes {}