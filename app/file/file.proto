syntax = "proto3";

package file;
option go_package = "./file";
option java_multiple_files = true;
option java_package = "com.github.file.grpc";
option java_outer_classname = "FileProto";

message Req {
  string ping = 1;
}

message Res {
  string pong = 1;
}

message Oss{
  string id = 1;
  string tenant_id = 2 [json_name = "tenantId"]; // 租户ID
  int64 category = 3; // 所属分类
  string oss_code = 4 [json_name = "ossCode"]; // 资源编号
  string endpoint = 5; // 资源地址
  string access_key = 6 [json_name = "accessKey"]; // accessKey
  string secret_key = 7 [json_name = "secretKey"]; // secretKey
  string bucket_name = 8 [json_name = "bucketName"]; // 空间名
  string app_id = 9 [json_name = "appId"]; // 应用ID TencentCOS需要
  string region = 10; // 地域简称 TencentCOS需要
  string remark = 11; // 备注
  int64 status = 12; // 状态
  string create_time = 13 [json_name = "createTime"];
  string update_time = 15 [json_name = "updateTime"];
}

message File {
  string link = 1; // 文件地址
  string domain = 2; // 域名地址
  string name = 3; // 文件名
  int64 size = 4; // 文件大小
  string format_size = 5 [json_name = "formatSize"]; // 格式化文件大小
  string original_name = 6 [json_name = "originalName"]; // 初始文件名
  string attach_id = 7 [json_name = "attachId"]; // 附件表ID
  string md5 = 8; // 原文件md5
  ImageMeta meta = 9; // 图片信息
  string thumb_link = 10 [json_name = "thumbLink"];     // 缩略图地址
  string thumb_name = 11 [json_name = "ThumbName"]; // 缩略图文件名
}

message ImageMeta {
  double longitude = 1;   // 经度
  double latitude = 2;    // 纬度
  string time = 3;        // 拍摄时间
  int32 img_height = 4 [json_name = "imgHeight"];    // 高
  int32 img_width = 5 [json_name = "imgWidth"];     // 宽
  double altitude = 6;    // 高度
  string camera_model = 7 [json_name = "cameraModel"]; // 相机型号
  string body_serial_number = 8 [json_name = "bodySerialNumber"]; // 机身序列号
  map<string, string> extra = 9; // 扩展元数据
}


message OssFile {
  string link = 1; // 文件地址
  string name = 2; // 文件名
  int64 size = 3; // 文件大小
  string format_size = 4 [json_name = "formatSize"]; // 格式化文件大小
  string put_time = 5 [json_name = "putTime"]; // 文件上传时间
  string content_type = 6 [json_name = "contentType"]; // 文件类型
  string sign_url = 7 [json_name = "signUrl"]; // 签名URL
}

message OssDetailReq{
  string id = 1;
}

message OssDetailRes{
  Oss oss = 1;
}

message OssListReq{
  int64 page = 1; // 页码
  int64 page_size = 2 [json_name = "pageSize"]; // 每页大小
  string order_by = 3 [json_name = "orderBy"]; // 排序
  string tenant_id = 4 [json_name = "tenantId"]; // 租户ID
  int64 category = 5; // 所属分类
}

message OssListRes{
  repeated Oss oss = 1;
  int64 total = 2;
}

message CreateOssReq{
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  int64 category = 2; // 所属分类
  string oss_code = 3 [json_name = "ossCode"]; // 资源编号
  string endpoint = 4; // 资源地址
  string access_key = 5 [json_name = "accessKey"]; // accessKey
  string secret_key = 6 [json_name = "secretKey"]; // secretKey
  string bucket_name = 7 [json_name = "bucketName"]; // 空间名
  string app_id = 8 [json_name = "appId"]; // 应用ID TencentCOS需要
  string region = 9; // 地域简称 TencentCOS需要
  string remark = 10; // 备注
}

message CreateOssRes{
  string id = 1;
}

message UpdateOssReq{
  string id = 1;
  string tenant_id = 2 [json_name = "tenantId"]; // 租户ID
  int64 category = 3; // 所属分类
  string oss_code = 4 [json_name = "ossCode"]; // 资源编号
  string endpoint = 5; // 资源地址
  string access_key = 6 [json_name = "accessKey"]; // accessKey
  string secret_key = 7 [json_name = "secretKey"]; // secretKey
  string bucket_name = 8 [json_name = "bucketName"]; // 空间名
  string app_id = 9 [json_name = "appId"]; // 应用ID TencentCOS需要
  string region = 10; // 地域简称 TencentCOS需要
  string remark = 11; // 备注
  int64 status = 12; // 状态
}

message UpdateOssRes{
}

message DeleteOssReq{
  string id = 1;
}

message DeleteOssRes{
  string id = 1;
}

message MakeBucketReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
}

message MakeBucketRes {
}

message RemoveBucketReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
}

message RemoveBucketRes {
}

message StatFileReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
  bool is_sign = 5 [json_name = "isSign"]; // 是否生成签名
  int32 expires = 6; // 过期时间 默认一小时 单位分钟
}

message StatFileRes{
  OssFile oss_file = 1 [json_name = "ossFile"];
}

message SignUrlReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
  int32 expires = 5; // 过期时间 默认一小时 单位分钟
}

message SignUrlRes{
  string url = 1; // 文件url
}

message PutFileReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
  string content_type = 5 [json_name = "contentType"];
  string path = 6; // 文件路径
  bool is_thumb = 7 [json_name = "isThumb"]; // 是否缩略图
  string path_prefix = 8 [json_name = "pathPrefix"]; // 默认值 default 文件路径前缀, 文件格式 pathPrefix/20060102/uuid.ext
}

message PutFileRes {
  File file = 1;
}

message PutStreamFileReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID 默认值 000000
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
  string content_type = 5 [json_name = "contentType"];
  bytes content = 6;   // 文件内容
  int64 size = 7; // 文件大小
  bool is_thumb = 8 [json_name = "isThumb"]; // 是否缩略图
  string path_prefix = 9 [json_name = "pathPrefix"]; // 默认值 upload 文件路径前缀, 文件格式 pathPrefix/20060102/uuid.ext
}

message PutStreamFileRes {
  File file = 1;
  bool is_end = 2 [json_name = "isEnd"]; // 是否结束
  int64 size = 3; // 文件大小
}

message RelayTarget {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
  string path_prefix = 5 [json_name = "pathPrefix"]; // 默认值 default 文件路径前缀
}

message RelayFileReq {
  // source - 二选一
  string source_url = 1 [json_name = "sourceUrl"];    // OSS HTTP 地址
  string source_path = 2 [json_name = "sourcePath"];   // 本地磁盘文件路径
  repeated RelayTarget targets = 3; // 目标 OSS 列表
  string content_type = 4 [json_name = "contentType"];  // 可选，不传则从源文件自动探测
}

message RelayFileRes {
  repeated File files = 1; // 上传成功的文件列表
}

message GetFileReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
}

message GetFileRes {
  string filename = 1; // 上传文件名
  string content_type = 2 [json_name = "contentType"];
  string path = 3; // 文件路径
}

message RemoveFileReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string filename = 4; // 上传文件名
}

message RemoveFileRes {
}

message RemoveFilesReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  repeated string filename = 4; // 上传文件名
}

message CaptureVideoStreamReq {
  string tenant_id = 1 [json_name = "tenantId"]; // 租户ID
  string code = 2; // 资源编号
  string bucket_name = 3 [json_name = "bucketName"]; // 存储桶名称
  string path_prefix = 5 [json_name = "pathPrefix"]; // 默认值 default 文件路径前缀, 文件格式 pathPrefix/20060102/uuid.ext

  string stream_url = 6 [json_name = "streamUrl"]; // 视频流
}

message CaptureVideoStreamRes {
  File file = 1;
}

service FileRpc {
  rpc Ping (Req) returns (Res);
  rpc OssDetail (OssDetailReq) returns (OssDetailRes); // 查看存储详情
  rpc OssList (OssListReq) returns (OssListRes); // 查看存储列表
  rpc CreateOss (CreateOssReq) returns (CreateOssRes); // 创建存储
  rpc UpdateOss (UpdateOssReq) returns (UpdateOssRes); // 更新存储
  rpc DeleteOss (DeleteOssReq) returns (DeleteOssRes); // 删除存储
  rpc MakeBucket (MakeBucketReq) returns (MakeBucketRes); // 创建存储桶
  rpc RemoveBucket (RemoveBucketReq) returns (RemoveBucketRes); // 删除存储桶
  rpc StatFile (StatFileReq) returns (StatFileRes); // 获取文件信息
  rpc SignUrl (SignUrlReq) returns (SignUrlRes); // 生成文件url
  rpc PutFile (PutFileReq) returns (PutFileRes); // 上传文件
  rpc PutStreamFile (stream PutStreamFileReq) returns (PutStreamFileRes); // 上传文件-流上传
  rpc RelayFile (RelayFileReq) returns (RelayFileRes); // 转推文件到多个 OSS
  rpc RemoveFile (RemoveFileReq) returns (RemoveFileRes); // 删除文件
  rpc RemoveFiles (RemoveFilesReq) returns (RemoveFileRes); // 批量删除文件
  rpc CaptureVideoStream (CaptureVideoStreamReq) returns (CaptureVideoStreamRes); // 截取视频流图片
}
