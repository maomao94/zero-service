syntax = "proto3";

package ispserver;

option go_package = "./ispserver";

service IspServer {
  rpc ListSessions(ListSessionsReq) returns(ListSessionsRes);
  rpc DisconnectSession(DisconnectSessionReq) returns(DisconnectSessionRes);
}

message SessionInfo {
  string session_id = 1 [json_name = "sessionId"];
  string device_code = 2 [json_name = "deviceCode"];
  string remote_addr = 3 [json_name = "remoteAddr"];
  int64 connected_at = 4 [json_name = "connectedAt"];
}

message ListSessionsReq {}

message ListSessionsRes {
  repeated SessionInfo sessions = 1 [json_name = "sessions"];
}

message DisconnectSessionReq {
  string session_id = 1 [json_name = "sessionId"];
}

message DisconnectSessionRes {}
