message CreatePlanTaskReq {
  // 机构code
  string dept_code = 101 [json_name = "deptCode", (validate.rules).string = {min_len: 1}];

  // 计划任务ID,全局唯一
  string plan_id = 1 [json_name = "planId", (validate.rules).string = {min_len: 1}];
  // 计划任务名称
  string plan_name = 2 [json_name = "planName", (validate.rules).string = {min_len: 1}];
  // 任务类型
  string type = 3 [json_name = "type", (validate.rules).string = {min_len: 1}];
  // 计划组ID,用于分组管理计划任务
  string group_id = 4 [json_name = "groupId"];
  // 描述
  string description = 5 [json_name = "description", (validate.rules).string = {max_len: 200}];
  // 规则生效开始时间
  // 不传默认本年
  // 格式：yyyy-MM-dd HH:mm:ss
  string start_time = 6 [json_name = "startTime"];
  // 规则生效结束时间
  // 不传默认本年
  // 格式：yyyy-MM-dd HH:mm:ss
  string end_time = 7 [json_name = "endTime"];
  // 计划规则项 默认 规则项 MINUTELY
  PlanRulePb rule = 8 [json_name = "rule", (validate.rules).message = {required: true}];
  // 排除日期列表
  // 格式：yyyy-MM-dd
  repeated string exclude_dates = 9 [json_name = "excludeDates", (validate.rules).repeated = {items: {string: {min_len: 1}}}];
  // 间隔时间 单位: 毫秒
  int64 interval_time = 10 [json_name = "intervalTime", (validate.rules).int64 = {gte: 0}];
  // 间隔类型 0-不间隔（同时发起） 1-往后顺延 2-间隔时间内偏移
  int32 interval_type = 11 [json_name = "intervalType", (validate.rules).int32 = {gte: 0, lte: 2}];
  // 计划执行项-根据规则项生成日期批次-batchId 并生成对应批次执行项-execId
  repeated CreatePlanExecItemPb exec_items = 12 [json_name = "execItems", (validate.rules).repeated = {min_items: 1}];
  // batchNum 前缀
  string batch_num_prefix = 13 [json_name = "batchNumPrefix"];
  // 是否跳过时间过滤，用于立即执行的计划
  bool skip_time_filter = 14 [json_name = "skipTimeFilter"];
  // 指定执行时间列表，格式：yyyy-MM-dd HH:mm:ss。
  repeated string specified_times = 15 [json_name = "specifiedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];
  // 精确排除时间列表，格式：yyyy-MM-dd HH:mm:ss。
  repeated string excluded_times = 16 [json_name = "excludedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];

  // 扩展字段
  string ext1 = 50 [json_name = "ext1"];
  string ext2 = 51 [json_name = "ext2"];
  string ext3 = 52 [json_name = "ext3"];
  string ext4 = 53 [json_name = "ext4"];
  string ext5 = 54 [json_name = "ext5"];
}

message PlanRulePb {
  // 规则项 0-YEARLY 1-MONTHLY 2-WEEKLY 3-DAILY 4-HOURLY 5-MINUTELY
  int32 freq = 1 [json_name = "freq", (validate.rules).int32 = {gte: 0, lte: 5}];
  // 月（1-12）
  repeated int32 month = 2 [json_name = "month",
    (validate.rules).repeated = {
      items: {int32: {gte: 1, lte: 12}}
    }
  ];
  // 月中的第几天（1-31 / -1 表示倒数第 1 天）
  repeated int32 day = 3 [json_name = "day",
    (validate.rules).repeated = {
      items: {int32: {gte: -31, lte: 31, not_in: [0]}}
    }
  ];
  // 星期（1-7，1=周一，7=周日）
  repeated int32 week = 4 [json_name = "week",
    (validate.rules).repeated = {
      items: {int32: {gte: 1, lte: 7}}
    }
  ];
  // 执行小时（0-23）
  repeated int32 hours = 5 [json_name = "hours",
    (validate.rules).repeated = {
      min_items: 1,
      items: {int32: {gte: 0, lte: 23}}
    }
  ];
  // 执行分钟（0-59）
  repeated int32 minutes = 6 [json_name = "minutes",
    (validate.rules).repeated = {
      min_items: 1,
      items: {int32: {gte: 0, lte: 59}}
    }
  ];
  // 周期步进：每隔 N 个 freq 周期执行一次（INTERVAL），0 或 1 表示每个周期都执行；
  // 例如 freq=1(MONTHLY) 且 interval=3 表示从任务开始时间起每 3 个月执行
  int32 interval = 7 [json_name = "interval"];
}

