syntax = "proto3";

package trigger;

import "validate/validate.proto";

option go_package = "./trigger";
option java_multiple_files = true;
option java_package = "com.github.trigger.grpc";
option java_outer_classname = "TriggerProto";

service TriggerRpc {
  // 发送 http-post-json 回调
  rpc SendTrigger(SendTriggerReq) returns(SendTriggerRes);
  // 发送 grpc proto字节码 回调
  rpc SendProtoTrigger(SendProtoTriggerReq) returns (SendProtoTriggerRes);
  // 获取队列列表
  rpc Queues(QueuesReq) returns (QueuesRes);
  // 获取队列信息
  rpc GetQueueInfo(GetQueueInfoReq) returns (GetQueueInfoRes);
  // 归档任务
  rpc ArchiveTask(ArchiveTaskReq) returns (ArchiveTaskRes);
  // 删除任务
  rpc DeleteTask(DeleteTaskReq) returns (DeleteTaskRes);
  // 获取任务
  rpc GetTaskInfo(GetTaskInfoReq) returns (GetTaskInfoRes);
  // 删除所有已完成任务
  rpc DeleteAllCompletedTasks(DeleteAllCompletedTasksReq) returns (DeleteAllCompletedTasksRes);
  // 删除所有已归档任务
  rpc DeleteAllArchivedTasks(DeleteAllArchivedTasksReq) returns (DeleteAllArchivedTasksRes);
  // 获取任务历史统计
  rpc HistoricalStats(HistoricalStatsReq) returns (HistoricalStatsRes);
  // 获取活跃任务列表
  rpc ListActiveTasks(ListActiveTasksReq) returns (ListActiveTasksRes);
  // 获取待处理任务列表
  rpc ListPendingTasks(ListPendingTasksReq) returns (ListPendingTasksRes);
  // 获取聚合任务列表
  rpc ListAggregatingTasks(ListAggregatingTasksReq) returns (ListAggregatingTasksRes);
  // 获取预定任务列表
  rpc ListScheduledTasks(ListScheduledTasksReq) returns (ListScheduledTasksRes);
  // 获取重试任务列表
  rpc ListRetryTasks(ListRetryTasksReq) returns (ListRetryTasksRes);
  // 获取已归档任务列表
  rpc ListArchivedTasks(ListArchivedTasksReq) returns (ListArchivedTasksRes);
  // 获取已完成任务列表
  rpc ListCompletedTasks(ListCompletedTasksReq) returns (ListCompletedTasksRes);
  // 运行任务
  rpc RunTask(RunTaskReq) returns (RunTaskRes);


  // 计算计划任务日期
  rpc CalcPlanTaskDate(CalcPlanTaskDateReq) returns (CalcPlanTaskDateRes);
  // 查询中国大陆日期类型
  rpc QueryHoliday(QueryHolidayReq) returns (QueryHolidayRes);
  // 查询中国大陆节日列表
  rpc ListHolidayFestivals(ListHolidayFestivalsReq) returns (ListHolidayFestivalsRes);
  // 获取中国大陆节日详情
  rpc GetHolidayFestival(GetHolidayFestivalReq) returns (GetHolidayFestivalRes);
  // 获取中国大陆全年节假日汇总
  rpc GetHolidayYearSummary(GetHolidayYearSummaryReq) returns (GetHolidayYearSummaryRes);
  // 获取已配置中国大陆节假日年份
  rpc ListHolidayYears(ListHolidayYearsReq) returns (ListHolidayYearsRes);
  // 获取中国大陆节假日源配置
  rpc ListHolidaySource(ListHolidaySourceReq) returns (ListHolidaySourceRes);
  // 保存中国大陆节假日源配置
  rpc SaveHolidaySource(SaveHolidaySourceReq) returns (SaveHolidaySourceRes);
  // 设置中国大陆节假日源配置启用状态
  rpc SetHolidaySourceEnabled(SetHolidaySourceEnabledReq) returns (SetHolidaySourceEnabledRes);
  // 创建计划任务
  rpc CreatePlanTask(CreatePlanTaskReq) returns (CreatePlanTaskRes);
  // 暂停计划
  rpc PausePlan(PausePlanReq) returns (PausePlanRes);
  // 终止计划
  rpc TerminatePlan(TerminatePlanReq) returns (TerminatePlanRes);
  // 恢复计划
  rpc ResumePlan(ResumePlanReq) returns (ResumePlanRes);
  // 暂停计划批次
  rpc PausePlanBatch(PausePlanBatchReq) returns (PausePlanBatchRes);
  // 终止计划批次
  rpc TerminatePlanBatch(TerminatePlanBatchReq) returns (TerminatePlanBatchRes);
  // 恢复计划批次
  rpc ResumePlanBatch(ResumePlanBatchReq) returns (ResumePlanBatchRes);
  // 暂停执行项
  rpc PausePlanExecItem(PausePlanExecItemReq) returns (PausePlanExecItemRes);
  // 终止执行项
  rpc TerminatePlanExecItem(TerminatePlanExecItemReq) returns (TerminatePlanExecItemRes);
  // 立即执行计划项
  rpc RunPlanExecItem(RunPlanExecItemReq) returns (RunPlanExecItemRes);
  // 恢复执行项
  rpc ResumePlanExecItem(ResumePlanExecItemReq) returns (ResumePlanExecItemRes);

  // 获取计划详情
  rpc GetPlan(GetPlanReq) returns (GetPlanRes);
  // 分页获取计划列表
  rpc ListPlans(ListPlansReq) returns (ListPlansRes);
  // 获取计划批次详情
  rpc GetPlanBatch(GetPlanBatchReq) returns (GetPlanBatchRes);
  // 分页获取计划批次列表
  rpc ListPlanBatches(ListPlanBatchesReq) returns (ListPlanBatchesRes);
  // 获取执行项详情
  rpc GetPlanExecItem(GetPlanExecItemReq) returns (GetPlanExecItemRes);
  // 分页获取执行项列表
  rpc ListPlanExecItems(ListPlanExecItemsReq) returns (ListPlanExecItemsRes);


  // 获取计划触发日志详情
  rpc GetPlanExecLog(GetPlanExecLogReq) returns (GetPlanExecLogRes);
  // 分页获取计划触发日志列表
  rpc ListPlanExecLogs(ListPlanExecLogsReq) returns (ListPlanExecLogsRes);
  // 获取执行项仪表板统计信息
  rpc GetExecItemDashboard(GetExecItemDashboardReq) returns (GetExecItemDashboardRes);


  // 回调计划执行项 ongoing 回执
  rpc CallbackPlanExecItem(CallbackPlanExecItemReq) returns (CallbackPlanExecItemRes);

  // ==================== CronTask / CronJob Service ====================

  // 创建基于 RRULE 的周期任务，返回 Trigger 生成的 JobId
  rpc CreateCronJob(CreateCronJobReq) returns (CreateCronJobRes);
  // 按 Trigger JobId 更新完整 Cron Job 配置，不允许修改 TaskCode
  rpc UpdateCronJob(UpdateCronJobReq) returns (UpdateCronJobRes);
  // 按 TaskCode 幂等提交完整 Cron Job 配置，不存在时创建，存在时更新
  rpc SubmitCronJob(SubmitCronJobReq) returns (SubmitCronJobRes);
  // 启用 Cron Job，并从当前时间重新计算未来执行时间
  rpc EnableCronJob(EnableCronJobReq) returns (EnableCronJobRes);
  // 禁用 Cron Job，禁用后调度器不再扫描该任务
  rpc DisableCronJob(DisableCronJobReq) returns (DisableCronJobRes);
  // 软删除 Cron Job，重复删除按幂等成功处理
  rpc DeleteCronJob(DeleteCronJobReq) returns (DeleteCronJobRes);
  // 立即异步执行一次 Cron Job，不改变周期计划
  rpc RunCronJob(RunCronJobReq) returns (RunCronJobRes);
  // 获取 Cron Job 详情
  rpc GetCronJob(GetCronJobReq) returns (GetCronJobRes);
  // 预览指定 Cron Job 从当前时间之后的计划执行时间，不改变任务状态
  rpc PreviewCronJobSchedule(PreviewCronJobScheduleReq) returns (PreviewCronJobScheduleRes);
  // 分页获取 Cron Job 列表
  rpc ListCronJobs(ListCronJobsReq) returns (ListCronJobsRes);

  // ==================== ID Generation Service ====================

  // 生成业务唯一编码（如工单号、告警编码等），由中间件统一生成，非数据库自增序列
  rpc NextId (NextIdReq) returns (NextIdRes);
  // 批量顺序生成业务唯一编码，用于业务批量插入前预生成编码
  rpc BatchNextId (BatchNextIdReq) returns (BatchNextIdRes);
  // 并发调用调度
  rpc Invoke(InvokeReq) returns (InvokeRes);
}

// 执行项调度状态枚举定义
enum ExecItemStatusPb {
  // 初始等待调度，可扫表触发
  EXEC_ITEM_STATUS_WAITING = 0;
  // 延期等待（业务失败重试或业务延期），可扫表触发
  EXEC_ITEM_STATUS_DELAYED = 10;
  // 已下发，等待业务回调，扫表时需判断超时
  EXEC_ITEM_STATUS_RUNNING = 100;
  // 执行项暂停（不扫表、不触发）
  EXEC_ITEM_STATUS_PAUSED = 150;
  // 执行完成终态，不再触发
  EXEC_ITEM_STATUS_COMPLETED = 200;
  // 人工/策略/超过重试次数终止，终态
  EXEC_ITEM_STATUS_TERMINATED = 300;
}

message TaskInfoPb {
  // ID is the identifier of the task.
  string id = 1 [json_name = "id"];
  // Queue is the name of the queue in which the task belongs.
  string queue = 2 [json_name = "queue"];
  // Type is the type name of the task.
  string type = 3 [json_name = "type"];
  // Payload is the payload data of the task.
  string payload = 4 [json_name = "payload"];
  // State indicates the task state.
  int32 state = 5 [json_name = "state"]; // 建议配合 enum TaskState 使用
  // MaxRetry is the maximum number of times the task can be retried.
  int32 max_retry = 6 [json_name = "maxRetry"];
  // Retried is the number of times the task has retried so far.
  int32 retried = 7 [json_name = "retried"];
  // LastErr is the error message from the last failure.
  string last_err = 8 [json_name = "lastErr"];
  // LastFailedAt is the time of the last failure.
  string last_failed_at = 9 [json_name = "lastFailedAt"];
  // Timeout is the duration the task can be processed before being retried.
  int64 timeout = 10 [json_name = "timeout"]; // 使用秒为单位的 duration
  // Deadline is the deadline for the task.
  string deadline = 11 [json_name = "deadline"];
  // Group is the name of the group in which the task belongs.
  string group = 12 [json_name = "group"];
  // NextProcessAt is the time the task is scheduled to be processed.
  string next_process_at = 13 [json_name = "nextProcessAt"];
  // IsOrphaned indicates if the task is left in active state with no worker.
  bool is_orphaned = 14 [json_name = "isOrphaned"];
  // Retention is duration of the retention period.
  int64 retention = 15 [json_name = "retention"]; // 使用秒为单位的 duration
  // CompletedAt is the time when the task is processed successfully.
  string completed_at = 16 [json_name = "completedAt"]; // 或 google.protobuf.Timestamp
  // Result holds the result data associated with the task.
  string result = 17 [json_name = "result"];
}

message DailyStatsPb {
  // Name of the queue.
  string queue = 1 [json_name = "queue"];
  // Total number of tasks being processed during the given date.
  // The number includes both succeeded and failed tasks.
  int64 processed = 2 [json_name = "processed"];
  // Total number of tasks failed to be processed during the given date.
  int64 failed = 3 [json_name = "failed"];
  // Date this stats was taken.
  string date = 4 [json_name = "date"];
}

message QueueInfoPb {
  // Name of the queue.
  string queue = 1 [json_name = "queue"];
  // Total number of bytes that the queue and its tasks require to be stored in redis.
  // It is an approximate memory usage value in bytes since the value is computed by sampling.
  int64 memory_usage = 2 [json_name = "memoryUsage"];
  // Latency of the queue, measured by the oldest pending task in the queue.
  string latency = 3 [json_name = "latency"];
  // Size is the total number of tasks in the queue.
  // The value is the sum of Pending, Active, Scheduled, Retry, Aggregating and Archived.
  int64 size = 4 [json_name = "size"];
  // Groups is the total number of groups in the queue.
  int64 groups = 5 [json_name = "groups"];
  // Number of pending tasks.
  int64 pending = 6 [json_name = "pending"];
  // Number of active tasks.
  int64 active = 7 [json_name = "active"];
  // Number of scheduled tasks.
  int64 scheduled = 8 [json_name = "scheduled"];
  // Number of retry tasks.
  int64 retry = 9 [json_name = "retry"];
  // Number of archived tasks.
  int64 archived = 10 [json_name = "archived"];
  // Number of stored completed tasks.
  int64 completed = 11 [json_name = "completed"];
  // Number of aggregating tasks.
  int64 aggregating = 12 [json_name = "aggregating"];
  // Total number of tasks being processed within the given date (counter resets daily).
  // The number includes both succeeded and failed tasks.
  int64 processed = 13 [json_name = "processed"];
  // Total number of tasks failed to be processed within the given date (counter resets daily).
  int64 failed = 14 [json_name = "failed"];
  // Total number of tasks processed (cumulative).
  int64 processed_total = 15 [json_name = "processedTotal"];
  // Total number of tasks failed (cumulative).
  int64 failed_total = 16 [json_name = "failedTotal"];
  // Paused indicates whether the queue is paused.
  // If true, tasks in the queue will not be processed.
  bool paused = 17 [json_name = "paused"];
  // Time when this queue info snapshot was taken.
  string timestamp = 18 [json_name = "timestamp"];
}

message SendTriggerReq {
  // 秒
  uint64 process_in = 1 [json_name = "processIn"];
  // 触发时间 2019-01-01 00:00:00 二选一 该字段存在时，优先使用
  string trigger_time = 2 [json_name = "triggerTime"];
  // POST json提交 不可为空
  string url = 3 [json_name = "url"];
  // 重试次数 可为空 默认: 25
  int64 max_retry = 4 [json_name = "maxRetry"];
  // 唯一消息 id 可为空
  string msg_id = 5 [json_name = "msgId"];
  // 触发内容，可为空
  string body = 6 [json_name = "body"];
}

message SendTriggerRes {
  // 唯一追踪 id
  string trace_id = 1 [json_name = "traceId"];
  // Queue is the name of the queue in which the task belongs.
  string queue = 2 [json_name = "queue"];
  // ID is the identifier of the task.
  string id = 3 [json_name = "id"];
}

message SendProtoTriggerReq {
  // 秒
  uint64 process_in = 1 [json_name = "processIn"];
  // 触发时间 2019-01-01 00:00:00 二选一 该字段存在时，优先使用
  string trigger_time = 2 [json_name = "triggerTime"];
  // 最大重试次数（可为空，默认 25 次）
  //
  // 任务失败后会重试，重试间隔采用指数退避策略，时间间隔随重试次数成倍增长：
  //   - 第 1 次重试间隔约 1 秒，
  //   - 第 2 次重试间隔约 2 秒，
  //   - 第 3 次重试间隔约 4 秒，
  //   - 依此类推，间隔时间不断翻倍，
  //   - 重试间隔最高封顶为 30 分钟（1800 秒）。
  //
  // 具体时间区间示例：
  //   1 次重试：约 1 秒
  //   5 次重试：约 16 秒
  //   7 次重试：约 64 秒（约 1 分钟）
  //   10 次重试：约 8 分钟
  //   12 次及以上重试：间隔固定为 30 分钟
  //
  // 总之，重试间隔从秒级开始，逐步增长到分钟、十几分钟，最终封顶 30 分钟。
  int64 max_retry = 3 [json_name = "maxRetry"];
  // 唯一消息 id 可为空
  string msg_id = 4 [json_name = "msgId"];
  // 服务名称 不可为空 示例 127.0.0.1:8080 direct:///127.0.0.1:8080,127.0.0.2:8080,nacos://nacos:nacos@127.0.0.1:8848/service?namespaceid=public&timeout=5000s
  string grpc_server = 5 [json_name = "grpcServer"];
  // 方法 不可为空
  string method = 6 [json_name = "method"];
  // pb 字节数据 不可为空
  bytes payload = 7 [json_name = "payload"];
  // 请求超时时间 单位: 毫秒 可为空
  int64 request_timeout = 8 [json_name = "requestTimeout"];
}

message SendProtoTriggerRes {
  // 唯一追踪 id
  string trace_id = 1 [json_name = "traceId"];
  // Queue is the name of the queue in which the task belongs.
  string queue = 2 [json_name = "queue"];
  // ID is the identifier of the task.
  string id = 3 [json_name = "id"];
}

message QueuesReq {
}

message QueuesRes {
  repeated string queues = 1 [json_name = "queues"];
}

message GetQueueInfoReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message GetQueueInfoRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
}

message ArchiveTaskReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  // ID is the identifier of the task.
  string id = 2 [json_name = "id", (validate.rules).string = {min_len: 1}];
}

message ArchiveTaskRes {
}

message DeleteTaskReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  // ID is the identifier of the task.
  string id = 2 [json_name = "id", (validate.rules).string = {min_len: 1}];
}

message DeleteTaskRes {
}

message GetTaskInfoReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  // ID is the identifier of the task.
  string id = 2 [json_name = "id", (validate.rules).string = {min_len: 1}];
}

message GetTaskInfoRes {
  TaskInfoPb task_info = 1 [json_name = "taskInfo"];
}

message DeleteAllCompletedTasksReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message DeleteAllCompletedTasksRes {
  int64 count = 1 [json_name = "count"];
}

message DeleteAllArchivedTasksReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message DeleteAllArchivedTasksRes {
  int64 count = 1 [json_name = "count"];
}

message HistoricalStatsReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  // 天
  uint32 n = 2 [json_name = "n", (validate.rules).uint32 = {gte:1, lte:90}];
}

message HistoricalStatsRes {
  repeated DailyStatsPb daily_stat = 1 [json_name = "dailyStat"];
}

message ListActiveTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListActiveTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListPendingTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListPendingTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListAggregatingTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  string group = 4 [json_name = "group", (validate.rules).string = {min_len: 1}];
}

message ListAggregatingTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListScheduledTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListScheduledTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListRetryTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListRetryTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListArchivedTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListArchivedTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message ListCompletedTasksReq {
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  string queue = 3 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
}

message ListCompletedTasksRes {
  QueueInfoPb queue_info = 1 [json_name = "queueInfo"];
  repeated TaskInfoPb tasks_info = 2 [json_name = "tasksInfo"];
}

message RunTaskReq {
  // Queue is the name of the queue in which the task belongs.
  string queue = 1 [json_name = "queue", (validate.rules).string = {min_len: 1}]; // 默认 critical
  // ID is the identifier of the task.
  string id = 2 [json_name = "id", (validate.rules).string = {min_len: 1}];
}

message RunTaskRes {
}

message CalcPlanTaskDateReq {
  // 规则生效开始时间
  // 不传默认本年
  // 格式：yyyy-MM-dd HH:mm:ss
  string start_time = 1 [json_name = "startTime"];
  // 规则生效结束时间
  // 不传默认本年
  // 格式：yyyy-MM-dd HH:mm:ss
  string end_time = 2 [json_name = "endTime"];
  // 计划规则项 默认 规则项 MINUTELY
  PlanRulePb rule = 3 [json_name = "rule", (validate.rules).message = {required: true}];
  // 排除日期列表
  // 格式：yyyy-MM-dd
  repeated string exclude_dates = 4 [json_name = "excludeDates", (validate.rules).repeated = {items: {string: {min_len: 1}}}];
  // 指定执行时间列表，格式：yyyy-MM-dd HH:mm:ss。
  repeated string specified_times = 5 [json_name = "specifiedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];
  // 精确排除时间列表，格式：yyyy-MM-dd HH:mm:ss。
