message CallbackPlanExecItemReq {
  // UUID主键ID
  string id = 1 [json_name = "id"];
  // 执行ID 全局唯一
  string exec_id = 2 [json_name = "execId"];
  // 回调设计 参考 grpc status 用于分布式事务
  // 执行结果：completed-业务执行完成, terminated-业务终止, failed-业务执行失败, delayed-业务执行延期, ongoing-业务正在执行（未回调或部分异步）
  string exec_result = 3 [json_name = "execResult", (validate.rules).string = {in: ["completed", "terminated", "failed", "delayed", "ongoing"]}];
  // 结果描述  可以定义自己状态码，等下次回调判断业务场景
  string message = 4 [json_name = "message", (validate.rules).string = {max_len: 1000}];
  // 结果原因 （成功/失败/延期原因，如“设备离线，延期至2024-01-01 09:00:00”）
  string reason = 5 [json_name = "reason", (validate.rules).string = {max_len: 1000}];
  // 延期配置-默认延期5分钟：delayed,ongoing-自定义延期
  DelayConfigPb delay_config = 6 [json_name = "delayConfig"];
}

message DelayConfigPb {
  // 下次触发时间（格式：yyyy-MM-dd HH:mm:ss，定时扫描的核心筛选条件）
  string next_trigger_time = 1 [json_name = "nextTriggerTime"];
  // 延期原因
  string delay_reason = 2 [json_name = "delayReason", (validate.rules).string = {max_len: 1000}];
}

message CallbackPlanExecItemRes {
}

// ==================== CronTask / CronJob Messages ====================

// CreateCronJobReq 是独立 RRULE 周期任务创建请求。
// Trigger 根据业务规则生成 RRuleStr、JobId 和首次 NextRun，不预拆分批次或执行项。
message CreateCronJobReq {
  // 全局唯一业务任务编码；与 Trigger 生成的 JobId 是两个不同标识。
  string task_code = 1 [json_name = "taskCode", (validate.rules).string = {min_len: 1, max_len: 128}];
  // 任务名称。
  string task_name = 2 [json_name = "taskName", (validate.rules).string = {min_len: 1, max_len: 128}];
  // 任务类型。
  string type = 3 [json_name = "type", (validate.rules).string = {min_len: 1, max_len: 64}];
  // 任务分组 ID，用于业务侧分组管理。
  string group_id = 4 [json_name = "groupId", (validate.rules).string = {max_len: 64}];
  // 任务描述。
  string description = 5 [json_name = "description", (validate.rules).string = {max_len: 200}];
  // 规则生效开始时间；不传时默认当前年份第一天，格式 yyyy-MM-dd HH:mm:ss。
  string start_time = 6 [json_name = "startTime"];
  // 规则生效结束时间；不传时默认开始时间所在年份最后一天，格式 yyyy-MM-dd HH:mm:ss。
  string end_time = 7 [json_name = "endTime"];
  // 业务周期规则，由 Trigger 编译为 RFC 5545 RRULE。
  PlanRulePb rule = 8 [json_name = "rule", (validate.rules).message = {required: true}];
  // 排除日期列表，格式 yyyy-MM-dd；这些日期的计划时间不会触发。
  repeated string exclude_dates = 9 [json_name = "excludeDates", (validate.rules).repeated = {items: {string: {len: 10}}}];
  // 调度优先级，数字越大越优先。
  int32 priority = 10 [json_name = "priority", (validate.rules).int32 = {gte: 0}];
  // 执行业务参数 JSON；为空表示没有业务参数。
  string payload = 11 [json_name = "payload"];
  // 单次调度锁超时，单位毫秒；0 表示使用调度器默认值。
  int64 lock_timeout = 12 [json_name = "lockTimeout", (validate.rules).int64 = {gte: 0}];
  // 最大延迟容忍，单位秒；0 表示使用调度器默认值。任务延迟超过此值跳过执行，直接计算下次时间。
  int64 max_delay = 13 [json_name = "maxDelay", (validate.rules).int64 = {gte: 0}];
  // 是否跳过首次未来时间过滤；为 true 时最多立即补触发一次，不追赶全部历史周期。
  bool skip_time_filter = 14 [json_name = "skipTimeFilter"];
  // 指定执行时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string specified_times = 15 [json_name = "specifiedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];
  // 精确排除时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string excluded_times = 16 [json_name = "excludedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];

  // 扩展字段 1。
  string ext1 = 50 [json_name = "ext1"];
  // 扩展字段 2。
  string ext2 = 51 [json_name = "ext2"];
  // 扩展字段 3。
  string ext3 = 52 [json_name = "ext3"];
  // 扩展字段 4。
  string ext4 = 53 [json_name = "ext4"];
  // 扩展字段 5。
  string ext5 = 54 [json_name = "ext5"];

  // 机构编码。
  string dept_code = 101 [json_name = "deptCode", (validate.rules).string = {min_len: 1, max_len: 64}];
}

// CreateCronJobRes 返回 Trigger 创建的周期任务标识和首次执行时间。
message CreateCronJobRes {
  // Trigger 生成的 JobId，对应 cron_job.id。
  string job_id = 1 [json_name = "jobId"];
  // 首次计划执行时间，格式 yyyy-MM-dd HH:mm:ss；规则已耗尽时为空字符串。
  string next_run = 2 [json_name = "nextRun"];
  // 最终持久化的任务分组 ID；请求未传时由 Trigger 自动生成 UUID。
  string group_id = 3 [json_name = "groupId"];
