  // 最大延迟容忍，单位秒；0 表示使用调度器默认值。任务延迟超过此值跳过执行，直接计算下次时间。
  int64 max_delay = 13 [json_name = "maxDelay", (validate.rules).int64 = {gte: 0}];
  // 是否跳过首次未来时间过滤；为 true 时最多立即补触发一次，不追赶全部历史周期。
  bool skip_time_filter = 14 [json_name = "skipTimeFilter"];
  // 指定执行时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string specified_times = 15 [json_name = "specifiedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];
  // 精确排除时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string excluded_times = 16 [json_name = "excludedTimes", (validate.rules).repeated = {max_items: 1000, items: {string: {len: 19}}}];

  // 扩展字段 1。
  string ext1 = 50 [json_name = "ext1"];
  // 扩展字段 2。
  string ext2 = 51 [json_name = "ext2"];
  // 扩展字段 3。
  string ext3 = 52 [json_name = "ext3"];
  // 扩展字段 4。
  string ext4 = 53 [json_name = "ext4"];
  // 扩展字段 5。
  string ext5 = 54 [json_name = "ext5"];

  // 机构编码；新建时必填，更新时为空表示不声明变更，非空时必须与已有值一致。
  string dept_code = 101 [json_name = "deptCode", (validate.rules).string = {max_len: 64}];
}

// SubmitCronJobRes 返回创建或更新后的任务标识和当前下次执行时间。
message SubmitCronJobRes {
  // Trigger 生成的 JobId，对应 cron_job.id。
  string job_id = 1 [json_name = "jobId"];
  // 当前可展示的下次执行时间，格式 yyyy-MM-dd HH:mm:ss；无下次调度时为空字符串。
  string next_run = 2 [json_name = "nextRun"];
  // 上游业务任务编码。
  string task_code = 3 [json_name = "taskCode"];
  // 最终持久化的任务分组 ID；更新已有任务时保留原值。
  string group_id = 4 [json_name = "groupId"];
}

// EnableCronJobReq 启用指定 Cron Job。
message EnableCronJobReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
}

// EnableCronJobRes 表示启用操作已完成。
message EnableCronJobRes {
}

// DisableCronJobReq 禁用指定 Cron Job。
message DisableCronJobReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
}

// DisableCronJobRes 表示禁用操作已完成。
message DisableCronJobRes {
}

// DeleteCronJobReq 软删除指定 Cron Job。
message DeleteCronJobReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
}

// DeleteCronJobRes 表示删除操作已完成；任务原本不存在时也返回成功。
message DeleteCronJobRes {
}

// RunCronJobReq 是 Cron Job 立即执行请求。
message RunCronJobReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
}

// RunCronJobRes 表示立即执行请求已受理，不表示异步业务回调已经成功。
message RunCronJobRes {
  // traceId 用于追踪异步执行过程，未接入 OTEL 时为空字符串。
  string trace_id = 1 [json_name = "traceId"];
}

// GetCronJobReq 是 Cron Job 详情查询请求。
message GetCronJobReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
}

// GetCronJobRes 返回 Cron Job 详情。
message GetCronJobRes {
  // Cron Job 详情。
  CronJobPb cron_job = 1 [json_name = "cronJob"];
}

// PreviewCronJobScheduleReq 是 Cron Job 未来执行时间预览请求。
message PreviewCronJobScheduleReq {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId", (validate.rules).string = {min_len: 1}];
  // 返回的执行时间数量；0 使用默认值 10，最大 100。
  int32 count = 2 [json_name = "count", (validate.rules).int32 = {gte: 0, lte: 100}];
}

// PreviewCronJobScheduleRes 返回基于持久化 RRULE Set 计算的未来执行时间。
message PreviewCronJobScheduleRes {
  // Trigger 生成的 JobId。
  string job_id = 1 [json_name = "jobId"];
  // 上游业务任务编码。
  string task_code = 2 [json_name = "taskCode"];
  // 严格晚于请求处理时刻的计划执行时间，格式 yyyy-MM-dd HH:mm:ss。
  repeated string execution_times = 3 [json_name = "executionTimes"];
  // 根据实际持久化 RRULE Set 生成的简体中文描述。
  string schedule_description = 4 [json_name = "scheduleDescription"];
  // 实际持久化并用于调度的 RFC 5545 RRULE Set 原文。
  string rrule_str = 5 [json_name = "rruleStr"];
}

// ListCronJobsReq 是 Cron Job 分页查询请求。
message ListCronJobsReq {
  // 分页大小；0 使用默认值。
  int64 page_size = 1 [json_name = "pageSize", (validate.rules).int64 = {gte: 0, lte: 500}];
  // 页码；0 使用默认值。
  int64 page_num = 2 [json_name = "pageNum", (validate.rules).int64 = {gte: 0, lte: 1000000}];
  // 业务任务编码模糊查询。
  string task_code = 3 [json_name = "taskCode", (validate.rules).string = {max_len: 128}];
  // 任务名称模糊查询。
  string task_name = 4 [json_name = "taskName", (validate.rules).string = {max_len: 128}];
  // 状态多选：0-禁用，1-启用。
  repeated int32 status = 5 [json_name = "status", (validate.rules).repeated = {items: {int32: {gte: 0, lte: 1}}}];
  // 机构编码精确查询。
  string dept_code = 6 [json_name = "deptCode", (validate.rules).string = {max_len: 64}];
  // 任务类型精确查询。
  string type = 7 [json_name = "type", (validate.rules).string = {max_len: 64}];
  // 任务分组 ID 精确查询。
  string group_id = 8 [json_name = "groupId", (validate.rules).string = {max_len: 64}];
}

// ListCronJobsRes 返回 Cron Job 分页列表。
message ListCronJobsRes {
  // Cron Job 列表。
  repeated CronJobPb cron_jobs = 1 [json_name = "cronJobs"];
  // 符合筛选条件的总记录数。
  int64 total = 2 [json_name = "total"];
}

// CronJobPb 是 Cron Job 对外管理视图。
message CronJobPb {
  // Trigger 生成的 JobId，对应 cron_job.id。
  string job_id = 1 [json_name = "jobId"];
  // 全局唯一业务任务编码。
  string task_code = 2 [json_name = "taskCode"];
  // 任务名称。
  string task_name = 3 [json_name = "taskName"];
  // 调度优先级，数字越大越优先。
  int32 priority = 4 [json_name = "priority"];
  // 单次调度锁超时，单位毫秒；0 表示使用调度器默认值。
  int64 lock_timeout = 5 [json_name = "lockTimeout"];
  // 最大延迟容忍，单位秒；0 表示使用调度器默认值。任务延迟超过此值跳过执行，直接计算下次时间。
  int64 max_delay = 6 [json_name = "maxDelay"];
  // 执行业务参数 JSON；为空表示没有业务参数。
  string payload = 7 [json_name = "payload"];
  // 状态：0-禁用，1-启用。
  int32 status = 9 [json_name = "status"];
  // 下次计划执行时间，格式 yyyy-MM-dd HH:mm:ss；无下次调度时为空字符串。
  string next_run = 10 [json_name = "nextRun"];
  // 上次成功执行时间，格式 yyyy-MM-dd HH:mm:ss；从未成功执行时为空字符串。
  string last_run = 11 [json_name = "lastRun"];
  // 任务类型。
  string type = 12 [json_name = "type"];
  // 任务分组 ID。
  string group_id = 13 [json_name = "groupId"];
  // 任务描述。
  string description = 14 [json_name = "description"];
  // 规则生效开始时间，格式 yyyy-MM-dd HH:mm:ss；调用方未指定时为空字符串。
  string start_time = 15 [json_name = "startTime"];
  // 规则生效结束时间，格式 yyyy-MM-dd HH:mm:ss；调用方未指定时为空字符串。
  string end_time = 16 [json_name = "endTime"];
  // 业务周期规则。
  PlanRulePb rule = 17 [json_name = "rule"];
  // 排除日期列表，格式 yyyy-MM-dd。
  repeated string exclude_dates = 18 [json_name = "excludeDates"];
  // 根据实际持久化 RRULE Set 生成的简体中文描述。
  string schedule_description = 19 [json_name = "scheduleDescription"];
  // 实际持久化并用于调度的 RFC 5545 RRULE Set 原文。
  string rrule_str = 20 [json_name = "rruleStr"];
  // 指定执行时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string specified_times = 21 [json_name = "specifiedTimes"];
  // 精确排除时间列表，格式 yyyy-MM-dd HH:mm:ss。
  repeated string excluded_times = 22 [json_name = "excludedTimes"];

  // 扩展字段 1。
  string ext1 = 50 [json_name = "ext1"];
  // 扩展字段 2。
  string ext2 = 51 [json_name = "ext2"];
  // 扩展字段 3。
  string ext3 = 52 [json_name = "ext3"];
  // 扩展字段 4。
  string ext4 = 53 [json_name = "ext4"];
  // 扩展字段 5。
  string ext5 = 54 [json_name = "ext5"];

  // 创建时间，格式 yyyy-MM-dd HH:mm:ss。
  string create_time = 100 [json_name = "createTime"];
  // 更新时间，格式 yyyy-MM-dd HH:mm:ss。
  string update_time = 101 [json_name = "updateTime"];
  // 机构编码。
  string dept_code = 102 [json_name = "deptCode"];
}

// ==================== ID Generation Messages ====================

message NextIdReq{
  // 输出描述类型 默认-P
  string out_desc_type = 1 [json_name = "outDescType", (validate.rules).string = {max_len: 64}];

  // true: 按维度/分类分开生成 ID
  // false: 全局统一生成 ID
  bool separate = 2 [json_name = "separate"];
}

message NextIdRes{
  string next_id = 1 [json_name = "nextId"];
}

message BatchNextIdReq{
  // 输出描述类型 默认-P
  string out_desc_type = 1 [json_name = "outDescType", (validate.rules).string = {max_len: 64}];

  // true: 按维度/分类分开生成 ID
  // false: 全局统一生成 ID
  bool separate = 2 [json_name = "separate"];

  // 生成数量，自动扩位；用于业务批量插入前顺序预生成编码
  uint32 count = 3 [json_name = "count", (validate.rules).uint32 = {gte: 1}];
}

message BatchNextIdRes{
  // 批量编码，按生成顺序返回
  repeated string next_ids = 1 [json_name = "nextIds"];
}

// ==================== Invoke Service ====================

// 单个调用任务描述
message InvokeTaskPb {
  // 任务唯一标识
  string id = 1 [json_name = "id", (validate.rules).string = {min_len: 1}];
  // 协议类型: http / grpc
  string protocol = 2 [json_name = "protocol", (validate.rules).string = {in: ["http", "grpc"]}];
  // 单任务超时时间（毫秒），0 表示不设单独超时
  int64 timeout = 3 [json_name = "timeout", (validate.rules).int64 = {gte: 0}];

  // === HTTP 字段 ===
  // 请求地址
  string url = 10 [json_name = "url"];
  // HTTP 方法: GET / POST / PUT / DELETE 等
  string http_method = 11 [json_name = "httpMethod"];
  // 自定义请求头
  map<string, string> headers = 12 [json_name = "headers"];
  // 请求体（JSON 格式；当 Content-Type 为 application/x-www-form-urlencoded 或 multipart/form-data 时，会将 JSON 键值对转为对应表单编码）
  bytes body = 13 [json_name = "body"];

  // === gRPC 字段 ===
  // gRPC 服务地址
  string grpc_server = 20 [json_name = "grpcServer"];
  // gRPC 方法全路径，如 /pb.Service/Method
  string method = 21 [json_name = "method"];
  // pb 字节数据
  bytes payload = 22 [json_name = "payload"];
}

// 并发调用请求
message InvokeReq {
  // 调用任务列表
  repeated InvokeTaskPb tasks = 1 [json_name = "tasks", (validate.rules).repeated = {min_items: 1}];
  // 最大并发数，0 或不设表示不限制
  int32 max_concurrency = 2 [json_name = "maxConcurrency", (validate.rules).int32 = {gte: 0}];
  // 调试模式，开启后在日志中打印每个任务的响应数据
  bool debug = 3 [json_name = "debug"];
}

// 单个任务执行结果
message InvokeTaskResultPb {
  // 任务唯一标识，与请求中的 id 对应
  string id = 1 [json_name = "id"];
  // 是否执行成功
  bool success = 2 [json_name = "success"];
  // HTTP 状态码或 gRPC 状态码
  int32 status_code = 3 [json_name = "statusCode"];
  // 错误信息（失败时）
  string error = 4 [json_name = "error"];
  // 返回数据
  bytes data = 5 [json_name = "data"];
  // 执行耗时（毫秒）
  int64 cost_ms = 6 [json_name = "costMs"];
  // 格式化耗时，如 "123ms"、"1.5s"
  string cost_formatted = 7 [json_name = "costFormatted"];
}

// 并发调用响应
message InvokeRes {
  // 每个任务的独立执行结果
  repeated InvokeTaskResultPb results = 1 [json_name = "results"];
}
