  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   restart: unless-stopped
  #   networks:
  #     - lk-net

  # # LiveKit SIP Server - SIP ↔ WebRTC 桥接 (已迁移到 SIPMediaGW)
