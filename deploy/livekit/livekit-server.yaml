# LiveKit Server 配置 - Docker 环境
# 容器内通过 host.docker.internal 访问宿主机服务

# HTTP API 和 WebSocket 端口
port: 7880

# WebRTC RTP 媒体流端口范围
rtc:
  port_range_start: 60000
  port_range_end: 60100

  # ========== 网络配置 ==========
  # 测试环境（浏览器与 LiveKit在同一内网 172.x.x.x）
  # use_external_ip: false
  #
  # 生产环境（浏览器通过公司局域网 10.x.x.x 访问）
  # use_external_ip: true
  # node_ip: "10.10.11.25"  # 服务器在公司局域网的 IP
  # =============================

  # 默认配置（开发环境）
  use_external_ip: false

# API 密钥对（至少 32 字符）
# livegtw 和 live 服务的配置文件必须使用相同的 key/secret
keys:
  devkeydevkeydevkeydevkeydevkeydevkey: secretsecretsecretsecretsecretsecret

# Redis 连接（宿主机已有 Redis，端口 36379）
redis:
  address: host.docker.internal:36379
  password: G62m50oigInC30sf

# Webhook 回调（livegtw 服务运行在宿主机 11002 端口）
webhook:
  urls:
    - http://host.docker.internal:11002/webhook/livekit
  api_key: devkeydevkeydevkeydevkeydevkeydevkey

