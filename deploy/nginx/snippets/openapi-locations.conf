# app 开放 API 网关共享 location（HTTP/HTTPS 两个 server 复用）
# 反代目标与 livegtw/socketgtw 一致，走宿主机 11005 端口。

# 访问 /openapi（不带斜杠）时补一个跳转，避免落到 Live SPA
location = /openapi {
    return 301 /openapi/;
}

# 开放 API 测试控制台静态站点（构建产物 base 为 /openapi/）
location /openapi/ {
    root /usr/share/nginx/html;
    # SPA 路由回落到控制台 index.html
    try_files $uri $uri/ /openapi/index.html;
    # 带 hash 的静态资源可长缓存，index.html 每次校验
    location /openapi/assets/ {
        try_files $uri =404;
        expires 7d;
    }
}

# 为什么这里必须重复写 root：
#   本文件会被 include 到多个 server 中，其中 Live 站点的 server root 是
#   /usr/share/nginx/html/live。精确匹配 location 不会继承 /openapi/ 前缀
#   location 里的 root，若不显式指定，会到 live/openapi/index.html 找文件并返回 404。
# 为什么用精确 location 单独处理 index：
#   只让入口 HTML 走 no-cache；/openapi/assets/ 下的 hash 资源仍保留 7 天缓存，
#   避免把 no-cache 误加到所有静态资源上。
location = /openapi/index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
}

# 开放 API：/v1/gateway、/v1/health
location /v1/ {
    proxy_pass http://host.docker.internal:11005;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 后端超时 120s，这里略放大，避免网关先断开
    proxy_connect_timeout 5s;
    proxy_read_timeout    130s;
    proxy_send_timeout    130s;
}

# 管理面默认不对外暴露；显式 404，避免被 SPA 的 / 回落成 index.html
location /open-admin/ {
    return 404;
}
