# GitLab API 项目地址回写（仅 gitlab.localhost 的 443 站点 include）
#
# 背景：
#   GitLab 的项目接口固定按 external_url（当前 http://10.10.1.100:8929）返回
#   web_url、http_url_to_repo、ssh_url_to_repo。
#   OpenChamber 会把这三个地址的 host 与实例地址（https://gitlab.localhost）比对，
#   不一致就报 "GitLab returned an invalid project"。
#
# 做法：
#   对整个 /api/ 的 JSON 响应做 host 回写，覆盖项目、MR、Issue、头像等所有接口；
#   git 传输与二进制响应不受影响。
#
# 注意：
#   - 必须关闭上游 gzip（见 gitlab-api-proxy.conf），否则 sub_filter 无法改写
#   - sub_filter 只处理 application/json
#   - GitLab 侧 external_url 改为正式域名后，本文件与 location 可一并删除
#   - 不要在其他入口（已废弃的 8929）重复维护同一套规则

include /etc/nginx/snippets/gitlab-api-proxy.conf;

sub_filter_types application/json;
sub_filter 'http://10.10.1.100:8929'    'https://gitlab.localhost';
sub_filter 'ssh://git@10.10.1.100:2224' 'ssh://git@gitlab.localhost';
sub_filter 'git@10.10.1.100:'           'git@gitlab.localhost:';
sub_filter_once off;
