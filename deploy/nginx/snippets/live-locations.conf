# Live 会议网关共享 location（HTTP/HTTPS 两个 server 复用）
# 静态前端根目录由 server 的 root 指定（/usr/share/nginx/html/live）

# SPA 前端路由：找不到文件回落到 index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 为什么单独处理 index.html：
#   index.html 文件名固定，但内容里引用的是本次构建的 hash 资源（如 index-abc123.js）。
#   如果它被浏览器强缓存，重新部署后用户仍会拿旧 HTML，进而继续加载旧资源，
#   表现就是“已经部署了但页面没变”。这里用 no-cache 要求每次使用前向 nginx 校验：
#   文件没变时返回 304，几乎不耗流量；文件变了立即拿到新入口。
#   注意不能用 no-store，否则每次都要完整下载 HTML。
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# 为什么资源可以长缓存：
#   Vite 构建出的 JS/CSS 文件名自带内容 hash，内容一变文件名就变。
#   因此 /assets/ 下的文件可以放心缓存 7 天，不需要每次回源；
#   新的 HTML 会自动引用新的 hash 文件名，不会命中旧缓存。
location /assets/ {
    try_files $uri =404;
    expires 7d;
}

# 录制文件：只读挂载 deploy/livekit/recordings，支持 Range 播放。
# 关闭 autoindex（禁止匿名目录浏览）、不下发通配 CORS（同源播放/下载无需跨域头）。
location /recordings/ {
    alias /usr/share/nginx/html/recordings/;
    autoindex off;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "no-cache" always;
}

# LiveKit 信令（WebSocket）：去掉 /livekit 前缀后转发到 livekit-server:7880
location /livekit/ {
    proxy_pass http://host.docker.internal:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# livegtw HTTP API（前缀 /live/v1 原样保留）
location /live/ {
    proxy_pass http://host.docker.internal:11002;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# socketgtw Socket.IO（会议邀请推送，WebSocket）
location /socket.io/ {
    proxy_pass http://host.docker.internal:11003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 健康检查
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}
