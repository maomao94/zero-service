# 公司 GitLab 反向代理
#
# 规范入口（唯一）：
#   https://gitlab.localhost/      网页 / API / git https
#   git@gitlab.localhost:...       git ssh（由 stream.d/gitlab-ssh.conf 转发到 2224）
#   http://gitlab.localhost/       仅网页兜底，不承诺 API
#
# 原理：路径原样透传，无前缀改写，GitLab 网页端绝对路径资源全部正常。
#       浏览器会自动把 *.localhost 解析到 127.0.0.1。
#       命令行（ssh / Node）不认 *.localhost，需要 hosts 或内网 DNS。
#
# 上游代理参数见 gitlab-upstream.conf；
# API 地址回写见 gitlab-api-rewrite.conf（含公共参数 gitlab-api-proxy.conf）；
# 证书参数见 tls.conf。

# ---------- GitLab（HTTP 子域名） ----------
server {
    listen 80;
    server_name gitlab.localhost;

    # Git push 大仓库不限制体积
    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}

# ---------- GitLab（HTTPS 子域名，复用网关自签证书） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name gitlab.localhost;

    include /etc/nginx/snippets/tls.conf;

    # 误用 http:// 访问 HTTPS 端口时，301 跳转到 https（保留原 Host:Port）
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 0;

    # OpenChamber 会校验项目接口返回的地址 host，必须与实例地址一致。
    # 注意：GitLab 项目路径里含 %2F，nginx 会先解码再做 location 匹配，
    # 因此按 /api/ 前缀匹配，而不是精确匹配项目路径。
    # 原始文件下载与仓库归档是二进制/流式响应，直接透传，避免被 JSON 回写误改
    location ~ ^/api/v4/projects/.+/repository/files/.+/raw$ {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }

    location ~ ^/api/v4/projects/.+/repository/archive(\.|$) {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/gitlab-api-rewrite.conf;
    }

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}
