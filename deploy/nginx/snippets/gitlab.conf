# 公司 GitLab 反向代理（子域名 + 本机端口）
#
# 入口：
#   http://gitlab.localhost/     https://gitlab.localhost/     网页 / git
#   http://127.0.0.1:8929/           OpenChamber 等只接受本机 HTTP 的客户端
#
# 原理：路径原样透传，无前缀改写，GitLab 网页端绝对路径资源全部正常。
#       *.localhost 由浏览器自动解析到 127.0.0.1，无需修改 hosts。
# 上游代理参数见 gitlab-upstream.conf，证书参数见 tls.conf。

# ---------- GitLab（HTTP 子域名） ----------
server {
    listen 80;
    server_name gitlab.localhost;

    # Git push 大仓库不限制体积
    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}

# ---------- GitLab（HTTPS 子域名，复用网关自签证书） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name gitlab.localhost;

    include /etc/nginx/snippets/tls.conf;

    # 误用 http:// 访问 HTTPS 端口时，301 跳转到 https（保留原 Host:Port）
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}

# ---------- GitLab（本机专用端口） ----------
# OpenChamber 的 GitLab 集成只接受 https，或 http + localhost/127.0.0.1；
# 因此单独监听 8929，宿主机只绑定 127.0.0.1（见 docker-compose.yaml）。
server {
    listen 8929;
    server_name _;

    client_max_body_size 0;

    # OpenChamber 会把 /api/v4 返回的 web_url、http_url_to_repo、ssh_url_to_repo
    # 与配置的实例地址做 host+port 比对，而 GitLab 固定按 external_url
    # (http://10.10.1.100:8929) 返回项目地址。这里只对 JSON 响应做 host 回写，
    # git 的 info/refs、packfile 等二进制流量仍走下面的流式透传。
    location /api/ {
        proxy_pass http://10.10.1.100:8929;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游压缩后 sub_filter 无法改写，强制返回明文
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        sub_filter_types application/json;
        sub_filter 'http://10.10.1.100:8929' 'http://127.0.0.1:8929';
        sub_filter 'ssh://git@10.10.1.100:2224' 'ssh://git@127.0.0.1:2224';
        sub_filter_once off;
    }

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}
