# GitLab SSH（TCP）转发
#
# 目的：
#   - 让 git@gitlab.localhost:<group>/<repo>.git 不写端口即可访问 GitLab SSH
#   - 与 OpenChamber 实例 https://gitlab.localhost 的主机名保持一致，
#     客户端无需维护 ~/.ssh/config 的 Host/Port 映射
#   - 新机器只要 DNS 能解析 gitlab.localhost，拉起本网关后即可直接 clone
#
# 拓扑：
#   git client -> 宿主机 ${GITLAB_SSH_HOST_PORT:-22}
#              -> 容器 web-gateway:22（nginx stream）
#              -> 10.10.1.100:2224（GitLab SSH）
#
# 注意：
#   - stream 块必须位于 main context，由 deploy/nginx/nginx.conf 统一 include
#   - 宿主机 22 端口被占用时，通过 GITLAB_SSH_HOST_PORT 换端口，
#     但换端口后客户端地址需显式带端口，会破坏“免配置”的目的
#   - 本文件只做 TCP 透传，不做 TLS 终止，GitLab 主机密钥由上游返回

stream {
    server {
        listen 22;
        proxy_pass 10.10.1.100:2224;

        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        # 复用上游连接，降低频繁 clone/fetch 时的握手开销
        proxy_socket_keepalive on;
    }
}
