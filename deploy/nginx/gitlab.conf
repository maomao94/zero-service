# 公司 GitLab 反向代理（子域名 + 本机端口）
#
# 入口：
#   http://gitlab.localhost/     https://gitlab.localhost/     网页 / git
#   http://127.0.0.1:8929/           OpenChamber 等只接受本机 HTTP 的客户端
#
# 原理：路径原样透传，无前缀改写，GitLab 网页端绝对路径资源全部正常。
#       *.localhost 由浏览器自动解析到 127.0.0.1，无需修改 hosts。
# 上游代理参数见 gitlab-upstream.conf，证书参数见 tls.conf。

# ---------- GitLab（HTTP 子域名） ----------
server {
    listen 80;
    server_name gitlab.localhost;

    # Git push 大仓库不限制体积
    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}

# ---------- GitLab（HTTPS 子域名，复用网关自签证书） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name gitlab.localhost;

    include /etc/nginx/snippets/tls.conf;

    # 误用 http:// 访问 HTTPS 端口时，301 跳转到 https（保留原 Host:Port）
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}

# ---------- GitLab（本机专用端口） ----------
# OpenChamber 的 GitLab 集成只接受 https，或 http + localhost/127.0.0.1；
# 因此单独监听 8929，宿主机只绑定 127.0.0.1（见 docker-compose.yaml）。
server {
    listen 8929;
    server_name _;

    client_max_body_size 0;

    location / {
        include /etc/nginx/snippets/gitlab-upstream.conf;
    }
}
