# Zero Service 网关主配置（挂载为 /etc/nginx/nginx.conf）
# 说明：
#   - 原镜像默认主配置保持不变，仅额外 include stream 目录
#   - HTTP 业务配置仍在 conf.d/default.conf（挂载 deploy/nginx/nginx.conf）
#   - stream 只能写在 main context，不能放进 http，因此需要接管主配置
#   - SSH 转发规则见 deploy/nginx/gitlab-ssh.conf（挂载到 /etc/nginx/stream.d/）

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}

# TCP/SSH 转发：GitLab SSH 走标准 22 端口，客户端无需 ~/.ssh/config 端口映射
include /etc/nginx/stream.d/*.conf;
