# ============================================================
# Zero Service Web 网关（静态前端 + 反向代理）
#
# 端口规划（宿主机 -> 容器）：
#   ${NGINX_HOST_PORT:-80}  -> 80    统一 HTTP 入口（Live 默认站点 + 各系统子域名）
#   ${NGINX_SSL_HOST_PORT:-443} -> 443 统一 HTTPS 入口（同上）
#   ${SOCKETIO_HOST_PORT:-8090} -> 8090 SocketIO 测试工具（独立端口，仅 HTTP）
#   ${WORKSPACE_HOST_PORT:-8091} -> 8091 Zero 工作台（独立端口，仅 HTTP）
#   ${GITLAB_DIRECT_PORT:-8929} -> 8929 GitLab 本机直连（仅绑 127.0.0.1，供 OpenChamber）
#
# 站点分发（容器内 80/443，按 Host 头区分）：
#   默认站点（server_name _）         -> dist/live 前端 + Live 网关
#   gitlab.localhost                 -> 公司 GitLab（10.10.1.100:8929）
#
# 文件职责：
#   live-locations.conf   Live 业务 location（前端/录制/API/WS）
#   gitlab.conf           GitLab server（子域名 HTTP/HTTPS + 本机 8929）
#   gitlab-upstream.conf  GitLab 上游代理参数
#   tls.conf              HTTPS 共享证书与协议参数
# ============================================================

# ---------- HTTP 公共参数 ----------
client_max_body_size 50m;          # GitLab 上传在 gitlab.conf 内单独放开
server_tokens off;
gzip on;
gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
gzip_min_length 1k;

# ---------- Live 会议前端 + 网关（HTTP，默认站点） ----------
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/live;
    include /etc/nginx/snippets/live-locations.conf;
}

# ---------- Live 会议前端 + 网关（HTTPS，默认站点） ----------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    root /usr/share/nginx/html/live;

    include /etc/nginx/snippets/tls.conf;

    # 误用 http:// 访问 HTTPS 端口时，301 跳转到 https（保留原 Host:Port）
    error_page 497 =301 https://$http_host$request_uri;

    include /etc/nginx/snippets/live-locations.conf;
}

# ---------- 公司 GitLab 反向代理（子域名 + 本机端口） ----------
include /etc/nginx/snippets/gitlab.conf;

# ---------- SocketIO 网关测试工具（静态，HTTP） ----------
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html/socketio;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 工具自身的 Socket.IO 连接也需代理
    location /socket.io/ {
        proxy_pass http://host.docker.internal:11003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- Zero 工作台（静态，HTTP） ----------
server {
    listen 8091;
    server_name _;
    root /usr/share/nginx/html/workspace;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子系统健康检查（同源，供工作台探测在线状态，避免工作台写死 localhost 端口）
    # live：同容器 80 端口（Live 站点）的 /healthz
    location = /health/live {
        access_log off;
        proxy_pass http://127.0.0.1/healthz;
    }
    # socketio：同容器 8090 端口测试工具的首页
    location = /health/socketio {
        access_log off;
        proxy_pass http://127.0.0.1:8090/;
    }
    # gitlab：同容器 80 端口 GitLab 子域名的登录页
    # 用 HEAD 只取状态码（响应约 10KB 的登录页没必要传），并限制超时避免拖住探测
    location = /health/gitlab {
        access_log off;
        proxy_set_header Host gitlab.localhost;
        proxy_method HEAD;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass http://127.0.0.1:80/users/sign_in;
    }
}
