# ============================================================
# Zero Service Web 网关（静态前端 + 反向代理）
#   - /            -> web/live/dist（会议前端，真实构建产物）
#   - /recordings/ -> deploy/livekit/recordings（录制文件）
#   - /live/       -> livegtw:11002（HTTP API）
#   - /socket.io/  -> socketgtw:11003（Socket.IO / WS）
#   - /livekit/    -> livekit-server:7880（信令 WS，去掉前缀）
# 另有：socketio 测试工具(8090)、workspace 工作台(8091) 静态站点
# HTTP(80)/HTTPS(443) 共享 live-locations.conf
# ============================================================

# ---------- Live 会议前端 + 网关（HTTP，默认推荐） ----------
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/live;
    include /etc/nginx/snippets/live-locations.conf;
}

# ---------- Live 会议前端 + 网关（HTTPS，自签证书，可选） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html/live;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/live-locations.conf;
}

# ---------- SocketIO 网关测试工具（静态，HTTP） ----------
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html/socketio;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 工具自身的 Socket.IO 连接也需代理
    location /socket.io/ {
        proxy_pass http://host.docker.internal:11003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- Zero 工作台（静态，HTTP） ----------
server {
    listen 8091;
    server_name _;
    root /usr/share/nginx/html/workspace;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子系统健康检查（同源，供工作台探测在线状态，避免工作台写死 localhost 端口）
    # live：同容器 80 端口（Live 站点）的 /healthz
    location = /health/live {
        access_log off;
        proxy_pass http://127.0.0.1/healthz;
    }
    # socketio：同容器 8090 端口测试工具的首页
    location = /health/socketio {
        access_log off;
        proxy_pass http://127.0.0.1:8090/;
    }
}
