# Live 会议网关共享 location（HTTP/HTTPS 两个 server 复用）
# 静态前端根目录由 server 的 root 指定（/usr/share/nginx/html/live）

# SPA 前端路由：找不到文件回落到 index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 录制文件：只读挂载 deploy/livekit/recordings，支持目录浏览/跨域/Range 播放
location /recordings/ {
    alias /usr/share/nginx/html/recordings/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "no-cache" always;
}

# LiveKit 信令（WebSocket）：去掉 /livekit 前缀后转发到 livekit-server:7880
location /livekit/ {
    proxy_pass http://host.docker.internal:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# livegtw HTTP API（前缀 /live/v1 原样保留）
location /live/ {
    proxy_pass http://host.docker.internal:11002;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# socketgtw Socket.IO（会议邀请推送，WebSocket）
location /socket.io/ {
    proxy_pass http://host.docker.internal:11003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 健康检查
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}
