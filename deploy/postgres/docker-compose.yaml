# PostgreSQL 16 Docker 部署
# 用途: 本地开发和测试业务系统，也可按需作为数据迁移过程中的临时数据库
# 对照官方镜像: https://hub.docker.com/_/postgres
#
# 前置: bash deploy/postgres/deploy.sh
# 说明:
#   - 默认端口 5432 直映射到宿主机；如本机已有 PostgreSQL，占用冲突时由开发者自行修改左侧宿主机端口
#   - 数据持久化 ./data -> /var/lib/postgresql/data，down 不丢数据
#   - 默认用户 postgres / postgres，库 postgres
#   - 如需让外部迁移工具访问，使用宿主机映射端口；KDTS 跨 compose 时可使用 host.docker.internal

services:
  postgres:              # 服务名，compose 网络内 DNS 为 postgres
    image: postgres:16-alpine  # 轻量镜像，需 PG16 特性可用 postgres:16
    container_name: pgsql  # 固定容器名，方便脚本 exec；注意与 sipmediagw 的 postgres 容器名不冲突（此处用 pgsql）
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432" # 默认端口直映射；需要避让时设置 POSTGRES_HOST_PORT
    volumes:
      - ./data:/var/lib/postgresql/data  # 持久化
    environment:
      - POSTGRES_USER=postgres  # 默认用户
      - POSTGRES_PASSWORD=postgres  # 默认密码（本地开发）
      - POSTGRES_DB=postgres    # 默认库
      - TZ=Asia/Shanghai        # 时区
      - PGTZ=Asia/Shanghai
    restart: unless-stopped
    command: postgres -c timezone=Asia/Shanghai  # 强制东八区，与 kingbase/opengauss 一致
