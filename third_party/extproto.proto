  _1_00_EVENT_PROCESS_FAILED = 100095 [(name) = "事件处理失败", (http_code) = 500];

  // 认证/授权（110-139）
  _1_00_UNAUTHORIZED = 100110 [(name) = "未认证", (http_code) = 401];
  _1_00_TOKEN_EXPIRED = 100111 [(name) = "凭据已过期", (http_code) = 401];
