syntax = "proto3";
package extproto;

option go_package = "zero-service/third_party/extproto;extproto";
option java_multiple_files = true;
option java_package = "com.github.extproto";
option java_outer_classname = "ExtProto";

import "google/protobuf/descriptor.proto";

message CurrentUser {
  string userId = 1 [json_name = "userId"];
  string userName = 2 [json_name = "userName"];
  string tenantId = 3 [json_name = "tenantId"];
  map<string, string> metadata = 100 [json_name = "metadata"];
  repeated Dept dept = 101 [json_name = "dept"];
}

message Dept {
  string deptId = 1 [json_name = "deptId"];
  string deptCode = 2 [json_name = "deptCode"];
  string deptName = 3 [json_name = "deptName"];
}

extend google.protobuf.EnumValueOptions {
  string name = 5001;
  // 扩展字段不支持 json_name 选项，按 proto 字段名 http_code 输出。
  int32 http_code = 5002;
}

/**
 * Code 表示系统统一平台错误码定义。
 * 编码格式参考大疆上云 DJIErrorCode 的 ABCDEF 六位设计，但码表与语义完全独立，
 * 不复用、不映射、不透传 DJI 或其他厂商的错误码。
 *
 * 错误码整体为 “ABCDEF” 六位数字，各维度含义固定，不得混用：
 *   - A   ：错误来源（上报方）
 *           0 = 成功（仅 000000）
 *           1 = 平台服务端（本仓库微服务、HTTP/gRPC 网关）
 *           2-9 预留
 *           本枚举不定义设备/第三方厂商码；DJI 等厂商码是独立体系，
 *           其首位含义由厂商定义，不参与本表解析。
 *   - BC  ：功能模块（两位），仅对 A=1 的码生效，按产品能力划分
 *           已启用：00 通用、30 开放平台
 *           其他功能域按需申请，不提前预分配；90-99 预留
 *   - DEF ：模块内唯一编号（三位），不承载业务语义
 *           001-999 为可用范围；000 保留
 *           按分类区间分配，区间内连续、区间之间预留扩展位
 *           每个模块最多 999 个码，用尽后申请新 BC
 *
 * 编码规则：
 *   1. 0 是唯一成功码，不得用于构造错误。
 *   2. 数字码对外发布后冻结，只允许追加，不得重编号或复用；本次上线前已统一重排。
 *   3. http_code 是“语义 HTTP 状态”，用于推导 gRPC Code 与客户端分类；
 *      网关实际统一返回 HTTP 200，业务结果以 body.code 为准。
 *   4. 对外错误必须可安全展示；内部细节（SQL、地址、堆栈）只写日志。
 *   5. DJI 等设备/第三方平台的错误码是另一套独立体系（如 dji_error_code.proto），
 *      与本枚举不互通、不映射、不透传，禁止写入 gRPC ErrorInfo.reason；
 *      厂商原始码只作为业务响应字段（如 reason_code）返回。
 *   6. DEF 是模块内唯一编号（001-999），不按业务语义分段，但按分类区间分配并预留扩展位；
 *      新码优先落在本分类预留号，用尽后再扩展区间或申请新 BC。HTTP 状态放 http_code，
 *      gRPC Code 由映射推导，不编码进 DEF；本次已在上线前统一重排，上线后冻结、只追加。
 */
enum Code {
  // ===== 成功（ABCDEF 全 0）=====
  _0_OK = 0 [(name) = "成功", (http_code) = 200];

  // ===== 通用（A=1, BC=00）=====
  // 下列区间是分类分配建议，预留扩展位；DEF 仍是模块内唯一编号，不参与运行时解析。
  // 系统（001-019）
  _1_00_INTERNAL = 100001 [(name) = "系统内部错误", (http_code) = 500];
  _1_00_UNKNOWN = 100002 [(name) = "未知错误", (http_code) = 500];
  _1_00_TIMEOUT = 100003 [(name) = "系统超时", (http_code) = 504];
  _1_00_CANCELED = 100004 [(name) = "请求已取消", (http_code) = 408];
  _1_00_NOT_IMPLEMENTED = 100005 [(name) = "功能未实现", (http_code) = 501];
  _1_00_SERVICE_UNAVAILABLE = 100006 [(name) = "服务不可用", (http_code) = 503];

  // 参数/请求（020-049）
  _1_00_PARAM = 100020 [(name) = "参数错误", (http_code) = 400];
  _1_00_PARAM_MISSING = 100021 [(name) = "缺少必要参数", (http_code) = 400];
  _1_00_PARAM_INVALID = 100022 [(name) = "参数不合法", (http_code) = 400];
  _1_00_PARAM_TYPE = 100023 [(name) = "参数类型错误", (http_code) = 400];
  _1_00_PARAM_RANGE = 100024 [(name) = "参数超出范围", (http_code) = 400];
  _1_00_PARAM_FORMAT = 100025 [(name) = "参数格式错误", (http_code) = 400];
  _1_00_REQUEST_MALFORMED = 100026 [(name) = "请求格式错误", (http_code) = 400];
  _1_00_REQUEST_BODY_TOO_LARGE = 100027 [(name) = "请求体过大", (http_code) = 413];
  _1_00_UNSUPPORTED_MEDIA_TYPE = 100028 [(name) = "媒体类型不支持", (http_code) = 415];
  _1_00_PAGINATION_INVALID = 100029 [(name) = "分页参数错误", (http_code) = 400];
  _1_00_IDEMPOTENCY_KEY_INVALID = 100030 [(name) = "幂等键无效", (http_code) = 400];
  _1_00_REQUEST_HEADER_INVALID = 100031 [(name) = "请求头不合法", (http_code) = 400];

  // 数据/存储（050-089）
  _1_00_DB = 100050 [(name) = "数据库错误", (http_code) = 500];
  _1_00_DB_CONSTRAINT = 100051 [(name) = "数据约束冲突", (http_code) = 409];
  _1_00_RECORD_NOT_EXIST = 100052 [(name) = "记录不存在", (http_code) = 404];
  _1_00_RECORD_ALREADY_EXIST = 100053 [(name) = "记录已存在", (http_code) = 409];
  _1_00_DATA_CONFLICT = 100054 [(name) = "数据冲突", (http_code) = 409];
  _1_00_DATA_CORRUPTED = 100055 [(name) = "数据损坏", (http_code) = 500];
  _1_00_TRANSACTION_FAILED = 100056 [(name) = "事务失败", (http_code) = 500];
  _1_00_SERIALIZATION_FAILED = 100057 [(name) = "序列化失败", (http_code) = 500];
  _1_00_DESERIALIZATION_FAILED = 100058 [(name) = "反序列化失败", (http_code) = 500];
  _1_00_VERSION_CONFLICT = 100059 [(name) = "版本冲突", (http_code) = 409];
  _1_00_OPTIMISTIC_LOCK_CONFLICT = 100060 [(name) = "乐观锁冲突", (http_code) = 409];

  // 缓存/消息（090-109）
  _1_00_CACHE = 100090 [(name) = "缓存错误", (http_code) = 500];
  _1_00_MQ = 100091 [(name) = "消息队列错误", (http_code) = 503];
  _1_00_MQ_PUBLISH_FAILED = 100092 [(name) = "消息发送失败", (http_code) = 503];
  _1_00_MQ_CONSUME_FAILED = 100093 [(name) = "消息消费失败", (http_code) = 500];
