  _1_00_TENANT_MISMATCH = 100115 [(name) = "租户不匹配", (http_code) = 403];
  _1_00_SCOPE_INSUFFICIENT = 100116 [(name) = "权限范围不足", (http_code) = 403];
  _1_00_IP_NOT_ALLOWED = 100117 [(name) = "来源 IP 不在白名单", (http_code) = 403];

  // 业务（140-179）
  _1_00_BIZ = 100140 [(name) = "业务处理失败", (http_code) = 409];
  _1_00_BIZ_STATE = 100141 [(name) = "业务状态不允许", (http_code) = 409];
  _1_00_BIZ_REPEAT = 100142 [(name) = "重复操作", (http_code) = 409];
  _1_00_BIZ_VALIDATION = 100143 [(name) = "业务校验失败", (http_code) = 400];
  _1_00_BIZ_RULE_VIOLATION = 100144 [(name) = "业务规则不满足", (http_code) = 409];
  _1_00_BIZ_QUOTA_EXCEEDED = 100145 [(name) = "业务配额不足", (http_code) = 429];
  _1_00_BIZ_EXPIRED = 100146 [(name) = "业务已过期", (http_code) = 409];
  _1_00_BIZ_LOCKED = 100147 [(name) = "业务已锁定", (http_code) = 409];
  _1_00_OPERATION_NOT_ALLOWED = 100148 [(name) = "操作不允许", (http_code) = 403];
  _1_00_RESOURCE_IN_USE = 100149 [(name) = "资源使用中", (http_code) = 409];

  // 外部依赖（180-219）
  _1_00_RPC = 100180 [(name) = "远程调用失败", (http_code) = 503];
  _1_00_RPC_TIMEOUT = 100181 [(name) = "远程调用超时", (http_code) = 504];
  _1_00_RPC_UNAVAILABLE = 100182 [(name) = "下游服务不可用", (http_code) = 503];
  _1_00_THIRD_PARTY = 100183 [(name) = "第三方服务异常", (http_code) = 503];
  _1_00_THIRD_PARTY_API = 100184 [(name) = "第三方接口错误", (http_code) = 502];
  _1_00_THIRD_PARTY_TIMEOUT = 100185 [(name) = "第三方超时", (http_code) = 504];
  _1_00_THIRD_PARTY_AUTH = 100186 [(name) = "第三方鉴权失败", (http_code) = 502];
  _1_00_EXTERNAL_RATE_LIMITED = 100187 [(name) = "外部限流", (http_code) = 429];
  _1_00_WEBHOOK_FAILED = 100188 [(name) = "Webhook 投递失败", (http_code) = 502];
  _1_00_DNS_ERROR = 100189 [(name) = "DNS 解析失败", (http_code) = 503];

  // 限流/配额（220-239）
  _1_00_RATE_LIMITED = 100220 [(name) = "请求过于频繁", (http_code) = 429];
