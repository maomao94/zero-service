  _1_00_REQUEST_TIMEOUT = 100246 [(name) = "请求超时", (http_code) = 408];
  _1_00_UPSTREAM_UNAVAILABLE = 100247 [(name) = "上游不可用", (http_code) = 503];

  // 文件/媒体（270-299）
  _1_00_FILE_NOT_FOUND = 100270 [(name) = "文件不存在", (http_code) = 404];
  _1_00_FILE_TOO_LARGE = 100271 [(name) = "文件过大", (http_code) = 413];
  _1_00_FILE_TYPE_NOT_ALLOWED = 100272 [(name) = "文件类型不允许", (http_code) = 415];
  _1_00_FILE_UPLOAD_FAILED = 100273 [(name) = "文件上传失败", (http_code) = 500];
