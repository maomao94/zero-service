Name: streamevent.rpc
ListenOn: 0.0.0.0:21009
Mode: dev
Timeout: 120000
Log:
  Encoding: plain
  #  Mode: file
  Path: /opt/logs/streamevent.rpc
  Level: debug
  KeepDays: 300
Middlewares:
  StatConf:
    IgnoreContentMethods: [/streamevent.StreamEvent/PushChunkAsdu]
NacosConfig:
  IsRegister: false
  Host: 127.0.0.1
  Port: 8848
  Username: nacos
  PassWord: nacos
  NamespaceId: public
  ServiceName: stream-event
TaosDB:
  DataSource: root:taosdata@http(localhost:6041)/?timezone=Asia%2FShanghai
  # IEC 104 采集库（与 deploy/tdengine/init.d/01-create_iec104.sql 建库名一致）
  DBName: iec104
DB:
  DataSource: file:./model/sql/default.db?_busy_timeout=5000&_journal_mode=WAL
DisableStmtLog: false